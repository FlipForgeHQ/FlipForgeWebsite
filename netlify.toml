[build]
  command = "npm run build:identity && npm run validate:identity && npm run build:paddle-live && npm run validate:paddle-live-payment-link && npm run validate:account-lifecycle && npm run validate:customer-intelligence && npm run validate:customer-dashboard && npm run validate:customer-compare && npm run validate:customer-management && npm run validate:customer-portfolio && npm run validate:customer-lifecycle && npm run validate:customer-export && npm run validate:customer-discovery && npm run validate:market-view && npm run validate:cardsight-evidence-visibility && npm run validate:price-intelligence && npm run validate:customer-entitlements && npm run validate:evaluation-quota-boundary && npm run validate:private-beta-operations-boundary && npm run validate:paddle-customer-checkout && npm run validate:paddle-customer-portal && npm run validate:paddle-webhook-gateway-boundary && npm run validate:private-beta && npm run validate:homepage-progression && node scripts/build-assets.js && node scripts/validate-brand-assets.js"
  publish = "."

[functions]
  directory = "netlify/modern-functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-wumeeI6dx0xNlGWRJpiV3jOhf8VPtf+yhn+75h8OlvI='; style-src 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self'; require-trusted-types-for 'script'; trusted-types default; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-wumeeI6dx0xNlGWRJpiV3jOhf8VPtf+yhn+75h8OlvI='; style-src 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self'; require-trusted-types-for 'script'; trusted-types default; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# FlipForge remains a static website. Netlify builds the current Identity client and
# the fail-closed Paddle Live browser configuration, validates authentication,
# intelligence visibility, payment-link boundaries, and approved brand assets, then
# publishes the repository root. The Paddle client-side token is injected only at
# build time; server API keys and webhook secrets remain outside browser assets. The
# SaaS API bridge remains environment-gated and disabled until separately authorized.
# Customer-facing CardSight evidence, Price Intelligence, and Market View contracts
# must pass their static safety gates before production publishing can complete.
# Homepage CSP and isolation headers are intentionally scoped to / and /index.html so
# customer app routes keep their existing Identity, Paddle, and API integration
# policies unchanged.
