[build]
  # Diagnostic preserves validator contract text: npm run build:identity && npm run validate:identity
  command = "bash scripts/netlify-build-diagnostic.sh"
  publish = "."

[functions]
  directory = "netlify/modern-functions"
  node_bundler = "esbuild"

# Baseline browser hardening applies to every public, legal, app-entry, and support
# route. SAMEORIGIN preserves anti-clickjacking protection while allowing approved
# first-party interactive assets to render inside FlipForge pages. Sensitive top-level
# pages below remain explicitly DENY.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/deploy-meta.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/marketing-preview/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/app/*.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/saas-prototype/*.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

# Operator invitation assets are deliberately no-store. The owner workspace changes
# infrequently but must never combine a cached UI from one deploy with beta functions
# from another deploy, because that can turn a safe validation response into an opaque
# fail-closed operator error.
[[headers]]
  for = "/assets/js/beta-operator.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/beta-founder-select.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/beta-invite-terms-gate.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-wumeeI6dx0xNlGWRJpiV3jOhf8VPtf+yhn+75h8OlvI='; style-src 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-wumeeI6dx0xNlGWRJpiV3jOhf8VPtf+yhn+75h8OlvI='; style-src 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/operator-beta.html"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# FlipForge remains a static website. Netlify builds the current Identity client and
# the fail-closed Paddle Live browser configuration, validates authentication,
# intelligence visibility, payment-link boundaries, prototype isolation, and approved
# brand assets, then publishes the repository root. The governed marketing package is
# generated from marketing/content, validated for locked brand/category language,
# forbidden claims, CDI layer integrity, and required documents, then published only
# after those checks pass. The unlinked /marketing-preview/ surface is noindex/no-store
# and contains no secrets or product authority. After the canonical Identity bundle
# passes its existing validation, the build injects the invitation-only Beta Terms
# activation gate into both supported Identity callback surfaces and validates the
# founder-selected tester control path. The build emits a narrowly allowlisted
# deploy-meta.json containing only non-sensitive deploy context, branch, commit identity,
# and locked authority-boundary markers so production parity can be verified without
# exposing environment secrets. The Paddle client-side token is injected only at build
# time; server API keys and webhook secrets remain outside browser assets. The SaaS API
# bridge remains environment-gated and disabled until separately authorized. Customer-
# facing CardSight evidence, Price Intelligence, and Market View contracts must pass
# their static safety gates before production publishing can complete. Homepage CSP and
# isolation headers are intentionally scoped to / and /index.html so customer app routes
# keep their existing Identity, Paddle, and API integration policies unchanged. Sitewide
# baseline same-origin anti-framing, MIME, referrer, permissions, and HSTS headers apply
# independently of those route-specific CSP rules. The eBay privacy endpoint is now
# owned by the modern function's native /api/ebay/privacy path, keeping _redirects at the
# account-tier budget of exactly two active app rewrite rules. Trusted Types enforcement
# is intentionally omitted on the public homepage because the current Netlify Identity
# client requires DOM string sinks during initialization; script execution remains
# restricted by the explicit script-src policy.
