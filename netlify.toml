[build]
  command = "npm run build:identity && npm run validate:identity && npm run build:paddle-live && npm run validate:paddle-live-payment-link && npm run validate:account-lifecycle && npm run validate:customer-intelligence && npm run validate:customer-dashboard && npm run validate:customer-compare && npm run validate:customer-management && npm run validate:customer-portfolio && npm run validate:customer-lifecycle && npm run validate:customer-export && npm run validate:customer-discovery && npm run validate:customer-entitlements && npm run validate:evaluation-quota-boundary && npm run validate:private-beta-operations-boundary && npm run validate:paddle-customer-checkout && npm run validate:paddle-customer-portal && npm run validate:paddle-webhook-gateway-boundary && npm run validate:private-beta && node scripts/build-assets.js && node scripts/validate-brand-assets.js"
  publish = "."

[functions]
  directory = "netlify/modern-functions"
  node_bundler = "esbuild"

# FlipForge remains a static website. Netlify builds the current Identity client and
# the fail-closed Paddle Live browser configuration, validates authentication and
# payment-link boundaries plus approved brand assets, then publishes the repository
# root. The Paddle client-side token is injected only at build time; server API keys
# and webhook secrets remain outside browser assets. The SaaS API bridge remains
# environment-gated and disabled until separately authorized. The authenticated
# Paddle checkout path and provider-hosted customer portal handoff are continuously
# validated, while the provider-facing Paddle webhook remains excluded from the
# customer gateway.
