[build]
  command = "npm run build:identity && npm run validate:identity && node scripts/validate-netlify-rule-budget.mjs && npm run build:paddle-live && npm run validate:paddle-live-payment-link && npm run validate:account-lifecycle && npm run validate:customer-intelligence && npm run validate:card-intelligence-result-priority && npm run validate:card-intelligence-detail-route && npm run validate:customer-dashboard && npm run validate:production-prototype-isolation && npm run validate:production-route-authority && node scripts/validate-native-evidence-links.mjs && npm run validate:customer-compare && npm run validate:customer-management && npm run validate:customer-portfolio && npm run validate:customer-lifecycle && npm run validate:customer-export && npm run validate:customer-discovery && npm run validate:market-view && npm run validate:cardsight-evidence-visibility && npm run validate:price-intelligence && npm run validate:customer-entitlements && npm run validate:evaluation-quota-boundary && npm run validate:private-beta-operations-boundary && npm run validate:paddle-customer-checkout && npm run validate:paddle-customer-portal && npm run validate:paddle-webhook-gateway-boundary && npm run validate:private-beta && npm run validate:homepage-progression && npm run validate:beta-acquisition && npm run validate:beta-operator && node scripts/build-assets.js && node scripts/validate-brand-assets.js && npm run build:deploy-manifest && npm run validate:deploy-manifest"
  publish = "."

[functions]
  directory = "netlify/modern-functions"
  node_bundler = "esbuild"

# Baseline browser hardening applies to every public, legal, app-entry, and support
# route. More specific route rules below may tighten these values further.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/deploy-meta.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/app/*.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/saas-prototype/*.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-wumeeI6dx0xNlGWRJpiV3jOhf8VPtf+yhn+75h8OlvI='; style-src 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-wumeeI6dx0xNlGWRJpiV3jOhf8VPtf+yhn+75h8OlvI='; style-src 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/operator-beta.html"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# FlipForge remains a static website. Netlify builds the current Identity client and
# the fail-closed Paddle Live browser configuration, validates authentication,
# intelligence visibility, payment-link boundaries, prototype isolation, and approved
# brand assets, then publishes the repository root. The build also emits a narrowly
# allowlisted deploy-meta.json containing only non-sensitive deploy context, branch,
# commit identity, and locked authority-boundary markers so production parity can be
# verified without exposing environment secrets. The Paddle client-side token is
# injected only at build time; server API keys and webhook secrets remain outside
# browser assets. The SaaS API bridge remains environment-gated and disabled until
# separately authorized. Customer-facing CardSight evidence, Price Intelligence, and
# Market View contracts must pass their static safety gates before production
# publishing can complete. Homepage CSP and isolation headers are intentionally scoped
# to / and /index.html so customer app routes keep their existing Identity, Paddle,
# and API integration policies unchanged. Sitewide baseline anti-framing, MIME,
# referrer, permissions, and HSTS headers apply independently of those route-specific
# CSP rules. The eBay privacy endpoint is now owned by the modern function's native
# /api/ebay/privacy path, keeping _redirects at the account-tier budget of exactly two
# active app rewrite rules. Trusted Types enforcement is intentionally omitted on the
# public homepage because the current Netlify Identity client requires DOM string sinks
# during initialization; script execution remains restricted by the explicit
# script-src policy.
