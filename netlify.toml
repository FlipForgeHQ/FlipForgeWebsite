[build]
  command = "npm run build:identity && npm run validate:identity && npm run validate:account-lifecycle && npm run validate:customer-intelligence && npm run validate:customer-dashboard && npm run validate:customer-compare && npm run validate:customer-management && npm run validate:private-beta && node scripts/build-assets.js && node scripts/validate-brand-assets.js"
  publish = "."

[functions]
  directory = "netlify/modern-functions"
  node_bundler = "esbuild"

# FlipForge remains a static website. Netlify builds the current Identity client,
# validates authentication boundaries and approved brand assets, then publishes
# the repository root. The SaaS API bridge remains environment-gated and disabled
# unless separately approved in a non-production deploy context.
