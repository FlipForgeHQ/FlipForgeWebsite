<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" role="img" aria-labelledby="title desc">
  <title id="title">FlipForge Card Decision Intelligence</title>
  <desc id="desc">FlipForge primary horizontal logo with the Card Decision Intelligence descriptor and Before you buy. Know Why. tagline.</desc>
  <style>
    @font-face{font-family:Geist;src:url('../fonts/geist-latin-wght-normal.woff2') format('woff2');font-weight:100 900}
    .word{font-family:Geist,Arial,sans-serif;font-weight:700}
    .support{font-family:Geist,Arial,sans-serif;font-weight:600}
  </style>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".58" stop-color="#8B8F98"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="goldTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".34" stop-color="#D4AF37"/><stop offset="1" stop-color="#B8860B"/></linearGradient>
    <linearGradient id="goldLeft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4AF37"/><stop offset="1" stop-color="#B8860B"/></linearGradient>
    <linearGradient id="goldRight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4AF37"/><stop offset=".62" stop-color="#B8860B"/><stop offset="1" stop-color="#8B8F98"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity=".48"/></filter>
  </defs>

  <g transform="matrix(.55 0 0 .55 7 4)">
    <path fill="url(#silver)" d="M32 30h72v28H60v44H32V30Zm120 0h72v72h-28V58h-44V30ZM32 154h28v44h44v28H32v-72Zm164 0h28v72h-72v-28h44v-44Z"/>
    <g filter="url(#shadow)">
      <path d="M128 67 181 97 128 128 75 97Z" fill="url(#goldTop)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
      <path d="M75 97 128 128 128 188 75 157Z" fill="url(#goldLeft)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
      <path d="M181 97 128 128 128 188 181 157Z" fill="url(#goldRight)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
      <path d="M128 67v61M75 97l53 31 53-31" fill="none" stroke="#FFF" stroke-opacity=".24" stroke-width="1.5"/>
    </g>
  </g>

  <text x="163" y="59" class="word" font-size="45" letter-spacing="7" aria-label="FLIPFORGE trademark">
    <tspan fill="#FFFFFF">FLIP</tspan><tspan fill="#D4AF37">FORGE</tspan><tspan fill="#D4AF37" font-size="11" letter-spacing="0" baseline-shift="super">™</tspan>
  </text>

  <path d="M162 84h31M548 84h26" stroke="#D4AF37" stroke-width="2"/>
  <text x="370" y="90" text-anchor="middle" class="support" font-size="13.5" letter-spacing="2.35" fill="#D4AF37" aria-label="CARD DECISION INTELLIGENCE">CARD DECISION INTELLIGENCE</text>

  <text x="365" y="120" text-anchor="middle" class="support" font-size="13" letter-spacing="1.2" aria-label="Before you buy. Know Why.">
    <tspan fill="#FFFFFF">Before you buy. </tspan><tspan fill="#D4AF37">Know Why.</tspan>
