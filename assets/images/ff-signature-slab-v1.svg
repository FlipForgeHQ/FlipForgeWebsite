<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 920" role="img" aria-labelledby="title description">
<title id="title">Illustrative collectible card in a transparent protective slab</title>
<desc id="description">Invented black-and-gold sports-card artwork with a stylized athlete silhouette and an illustrative card identity label. Not a real graded or marketed card.</desc>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FCFEFF"/><stop offset=".18" stop-color="#596069"/><stop offset=".39" stop-color="#F5F9FC"/><stop offset=".72" stop-color="#404850"/><stop offset="1" stop-color="#F3F7FA"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EBF0F8" stop-opacity=".22"/><stop offset=".19" stop-color="#FAFDFF" stop-opacity=".055"/><stop offset=".51" stop-color="#DCE4ED" stop-opacity=".015"/><stop offset=".84" stop-color="#EDF6FF" stop-opacity=".19"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".07"/></linearGradient>
  <linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151E25"/><stop offset=".36" stop-color="#04070B"/><stop offset=".68" stop-color="#17202A"/><stop offset="1" stop-color="#080B0D"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#F3E2A6"/><stop offset=".3" stop-color="#D4AF37"/><stop offset=".74" stop-color="#8D651B"/><stop offset="1" stop-color="#F6D974"/></linearGradient>
  <linearGradient id="label" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F8FBFF"/><stop offset=".5" stop-color="#CCD0D3"/><stop offset="1" stop-color="#FCFEFF"/></linearGradient>
  <radialGradient id="aurora"><stop stop-color="#D4AF37" stop-opacity=".35"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="7" dy="32" stdDeviation="24" flood-opacity=".5"/></filter>
  <clipPath id="cardclip"><rect x="68" y="234" width="525" height="604" rx="9"/></clipPath>
</defs>
<ellipse cx="347" cy="460" rx="276" ry="401" fill="url(#aurora)" opacity=".37" filter="url(#blur)"/>
