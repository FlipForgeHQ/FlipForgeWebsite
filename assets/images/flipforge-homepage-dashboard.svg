<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">FlipForge decision spotlight motion loop</title>
  <desc id="desc">An illustrative looping FlipForge workflow showing a seller claim for an Ohtani Refractor, evidence checks that leave the parallel unresolved, and a VERIFY decision with clear next steps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0e14"/><stop offset="1" stop-color="#020305"/></linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4af37" stop-opacity=".18"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f7f7"/><stop offset=".55" stop-color="#bfc3ca"/><stop offset="1" stop-color="#818792"/></linearGradient>
    <filter id="blueHalo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <style>
      @font-face{font-family:Geist;src:url('../fonts/geist-latin-wght-normal.woff2') format('woff2');font-weight:100 900}
      .font{font-family:Geist,'Geist Sans',Arial,sans-serif}.white{fill:#f7f8fa}.silver{fill:#c8cdd5}.muted{fill:#8d96a4}.gold{fill:#d4af37}.red{fill:#ffb1ae}.green{fill:#94e5b5}.blue{fill:#dceaff}.eyebrow{font-size:14px;font-weight:900;letter-spacing:2.5px}.small{font-size:14px}.body{font-size:17px}.label{font-size:16px;font-weight:850;letter-spacing:1.2px}.title{font-size:40px;font-weight:900;letter-spacing:-1px}.verdict{font-size:48px;font-weight:900;letter-spacing:-1.3px}.wordmark{font-size:30px;font-weight:900;letter-spacing:4.3px}.tag{font-size:12px;font-weight:850;letter-spacing:2.4px}
      .motion{pointer-events:none}.motion-claim{animation:claimLoop 10s ease-in-out infinite}.motion-good{animation:goodLoop 10s ease-in-out infinite}.motion-warn1{animation:warn1Loop 10s ease-in-out infinite}.motion-warn2{animation:warn2Loop 10s ease-in-out infinite}.motion-arrow{animation:arrowLoop 10s ease-in-out infinite}.motion-verdict{animation:verdictLoop 10s ease-in-out infinite}.motion-res1{animation:res1Loop 10s ease-in-out infinite}.motion-res2{animation:res2Loop 10s ease-in-out infinite}.motion-res3{animation:res3Loop 10s ease-in-out infinite}
      @keyframes claimLoop{0%,6%,100%{opacity:.06}10%,22%{opacity:.95}27%{opacity:.06}}
      @keyframes goodLoop{0%,18%,100%{opacity:.04}23%,34%{opacity:.85}39%{opacity:.04}}
      @keyframes warn1Loop{0%,28%,100%{opacity:.04}33%,45%{opacity:.92}50%{opacity:.04}}
      @keyframes warn2Loop{0%,38%,100%{opacity:.04}43%,55%{opacity:.95}60%{opacity:.04}}
      @keyframes arrowLoop{0%,46%,100%{opacity:.18}52%,63%{opacity:1}68%{opacity:.18}}
      @keyframes verdictLoop{0%,54%,100%{opacity:.1}61%,82%{opacity:1}88%{opacity:.18}}
      @keyframes res1Loop{0%,64%,100%{opacity:.12}70%,88%{opacity:.95}92%{opacity:.12}}
      @keyframes res2Loop{0%,69%,100%{opacity:.12}75%,90%{opacity:.95}94%{opacity:.12}}
      @keyframes res3Loop{0%,74%,100%{opacity:.12}80%,92%{opacity:.95}96%{opacity:.12}}
      @media(prefers-reduced-motion:reduce){.motion{animation:none!important;opacity:.35!important}}
    </style>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1232" height="672" rx="24" fill="none" stroke="#d4af37" stroke-opacity=".38"/>
  <rect x="24" y="24" width="1232" height="152" rx="24" fill="url(#goldGlow)"/>

  <g transform="translate(58 42)">
    <g transform="scale(1.2)">
      <path d="M0 0H22V11H11V22H0Z" fill="url(#silver)"/><path d="M34 0H56V22H45V11H34Z" fill="url(#silver)"/><path d="M0 34H11V45H22V56H0Z" fill="url(#silver)"/><path d="M45 34H56V56H34V45H45Z" fill="url(#silver)"/>
      <path d="M28 17 41 24.5 28 32 15 24.5Z" fill="#d4af37" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 24.5 28 32v15L15 39.5Z" fill="#b8860b" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><path d="M41 24.5 28 32v15l13-7.5Z" fill="#d4af37" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <text x="92" y="34" class="font wordmark white">FLIPFORGE</text>
    <text x="94" y="58" class="font tag gold">CARD INTELLIGENCE</text>
  </g>

  <g class="font">
    <text x="58" y="142" class="eyebrow gold">DECISION SPOTLIGHT · ILLUSTRATIVE</text>
    <text x="58" y="191" class="title white">ONE BAD CLAIM CAN CHANGE THE WHOLE DECISION.</text>
  </g>

  <g transform="translate(58 248)" class="font">
    <rect width="510" height="374" rx="20" fill="#0c1017" stroke="#343b47"/>
    <text x="24" y="38" class="eyebrow muted">SELLER CLAIM</text>
    <rect x="24" y="62" width="462" height="106" rx="15" fill="#111720" stroke="#303845"/>
    <rect class="motion motion-claim" x="24" y="62" width="462" height="106" rx="15" fill="#d4af37" fill-opacity=".05" stroke="#d4af37" stroke-width="2.5"/>
    <text x="42" y="98" class="label white">2018 TOPPS CHROME OHTANI #150 · PSA 10</text>
    <rect x="42" y="119" width="204" height="32" rx="16" fill="#251f0e" stroke="#d4af37" stroke-opacity=".75"/>
    <text x="144" y="141" text-anchor="middle" class="eyebrow white">CLAIMED: REFRACTOR</text>

    <text x="24" y="213" class="eyebrow gold">FLIPFORGE CHECKS</text>

    <rect x="24" y="235" width="462" height="50" rx="12" fill="#0e1914" stroke="#5ab17c" stroke-opacity=".62"/>
    <rect class="motion motion-good" x="24" y="235" width="462" height="50" rx="12" fill="#58d697" fill-opacity=".06" stroke="#8ae2ae" stroke-width="2.5"/>
    <circle cx="50" cy="260" r="13" fill="#183a27"/><text x="50" y="266" text-anchor="middle" font-size="16" font-weight="900" class="green">✓</text>
    <text x="76" y="257" class="label white">BASE IDENTITY ALIGNS</text>
    <text x="76" y="276" class="small muted">Year, set, player, card number, grader and grade match.</text>

    <rect x="24" y="296" width="462" height="62" rx="12" fill="#1a1012" stroke="#b85f62" stroke-opacity=".62"/>
    <rect class="motion motion-warn1" x="24" y="296" width="462" height="62" rx="12" fill="#ff7a7a" fill-opacity=".05" stroke="#ffaaa8" stroke-width="2.5"/>
    <rect class="motion motion-warn2" x="24" y="296" width="462" height="62" rx="12" fill="#ff7a7a" fill-opacity=".025"/>
    <circle cx="50" cy="327" r="13" fill="#37191d"/><text x="50" y="333" text-anchor="middle" font-size="17" font-weight="900" class="red">!</text>
    <text x="76" y="322" class="label white">PARALLEL UNRESOLVED</text>
    <text x="76" y="344" class="small muted">The Refractor claim is not proven. Mismatched comps stay out.</text>
  </g>

  <g class="font">
    <line x1="592" y1="438" x2="640" y2="438" stroke="#d4af37" stroke-width="2.5"/>
    <path d="M640 438 624 429v18Z" fill="#d4af37"/>
    <text x="616" y="414" text-anchor="middle" class="eyebrow gold">EVIDENCE GATE</text>
    <rect class="motion motion-arrow" x="582" y="388" width="68" height="72" rx="20" fill="#d4af37" fill-opacity=".03" stroke="#d4af37" stroke-opacity=".5"/>
  </g>

  <g transform="translate(666 260)" class="font">
    <rect width="556" height="360" rx="20" fill="#090d14" stroke="#395b8d" stroke-opacity=".72"/>
    <circle cx="438" cy="72" r="120" fill="#2967b8" fill-opacity=".08"/>
    <circle class="motion motion-verdict" cx="92" cy="74" r="52" fill="#4d8ee7" fill-opacity=".15" filter="url(#blueHalo)"/>
    <text x="26" y="38" class="eyebrow muted">FLIPFORGE VERDICT</text>
    <rect x="26" y="60" width="132" height="36" rx="18" fill="#132641" stroke="#4d8ee7" stroke-opacity=".75"/>
    <text x="92" y="84" text-anchor="middle" class="eyebrow blue">VERIFY</text>
    <text x="26" y="151" class="verdict white">VERIFY BEFORE YOU BUY.</text>
    <text x="26" y="184" class="body silver">The claimed parallel is not proven.</text>
    <text x="26" y="208" class="body silver">Hold the decision until the evidence is fixed.</text>

    <rect x="26" y="232" width="504" height="34" rx="10" fill="#17150b" stroke="#d4af37" stroke-opacity=".35"/>
    <rect class="motion motion-res1" x="26" y="232" width="504" height="34" rx="10" fill="#d4af37" fill-opacity=".05" stroke="#d4af37" stroke-width="1.5"/>
    <text x="44" y="255" class="label gold">1 · CONFIRM</text><text x="186" y="255" class="small white">Prove the exact parallel.</text>

    <rect x="26" y="275" width="504" height="34" rx="10" fill="#17150b" stroke="#d4af37" stroke-opacity=".35"/>
    <rect class="motion motion-res2" x="26" y="275" width="504" height="34" rx="10" fill="#d4af37" fill-opacity=".05" stroke="#d4af37" stroke-width="1.5"/>
    <text x="44" y="298" class="label gold">2 · REPLACE</text><text x="186" y="298" class="small white">Use exact verified comps only.</text>

    <rect x="26" y="318" width="504" height="34" rx="10" fill="#17150b" stroke="#d4af37" stroke-opacity=".35"/>
    <rect class="motion motion-res3" x="26" y="318" width="504" height="34" rx="10" fill="#d4af37" fill-opacity=".05" stroke="#d4af37" stroke-width="1.5"/>
    <text x="44" y="341" class="label gold">3 · RERUN</text><text x="186" y="341" class="small white">Recalculate with clean evidence.</text>
  </g>

  <g class="font">
    <line x1="58" y1="650" x2="1222" y2="650" stroke="#313741"/>
    <text x="58" y="686" font-size="20" font-weight="900" letter-spacing="1" class="white">Before you buy. Know Why.</text>
    <text x="1222" y="686" text-anchor="end" class="small gold">Claim → Check → VERIFY → Resolve</text>
  </g>
</svg>