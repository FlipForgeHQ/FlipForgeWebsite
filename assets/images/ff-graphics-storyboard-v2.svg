 <text x="26" y="82" fill="#D4AF37" font-size="14" font-weight="900" letter-spacing="2">DECISION RECEIPT</text>
 <text x="26" y="126" fill="#fff" font-size="24" font-weight="900">Keep the reason attached</text>
