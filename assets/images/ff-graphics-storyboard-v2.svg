   <text x="22" y="52" fill="#8e7b39" font-size="11" font-weight="900" letter-spacing="2">FLIPFORGE DECISION</text><text x="22" y="104" fill="#F2D46B" font-size="36" font-weight="900" letter-spacing="4">VERIFY</text><text x="22" y="142" fill="#b4bbc1" font-size="12" font-weight="700">Price found.</text><text x="22" y="165" fill="#b4bbc1" font-size="12" font-weight="700">Evidence tested.</text>
 </g>
 <text x="26" y="404" fill="#dfe3e6" font-size="16" font-weight="900">VERIFY · reason trace locked</text>
 <text x="26" y="438" fill="#68737d" font-size="12" font-weight="700">Decision intelligence, not a price chart.</text>
