<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">FlipForge product storyboard</title>
<desc id="d">Four-panel FlipForge product story: exact identity, evidence filter, supported value, and explainable decision.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020304"/><stop offset=".5" stop-color="#080d12"/><stop offset="1" stop-color="#020304"/></linearGradient>
