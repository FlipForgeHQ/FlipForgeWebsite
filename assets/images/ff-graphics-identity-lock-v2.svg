<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">FlipForge identity lock visualization</title>
<desc id="d">Premium black and gold sports card intelligence scene showing a card entering FlipForge, identity verification, evidence qualification, economics, and a decision overlay.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020304"/><stop offset=".52" stop-color="#070b10"/><stop offset="1" stop-color="#020304"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#D4AF37" stop-opacity=".26"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4DE86"/><stop offset=".45" stop-color="#D4AF37"/><stop offset="1" stop-color="#9A6A11"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#262c33"/><stop offset=".5" stop-color="#0d1116"/><stop offset="1" stop-color="#232930"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity=".72"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/>
<circle cx="810" cy="455" r="390" fill="url(#glow)" opacity=".72"/>
<g opacity=".2" stroke="#D4AF37" stroke-width="2">
  <path d="M110 190H570M1030 190h460M110 710h460M1030 710h460"/>
  <path d="M800 88v120M800 692v120"/>
</g>

<g transform="translate(205 210) rotate(-7 245 310)" filter="url(#shadow)">
  <rect width="490" height="620" rx="72" fill="#020304" stroke="#3b4148" stroke-width="10"/>
  <rect x="26" y="26" width="438" height="568" rx="50" fill="#070b10" stroke="#151b22" stroke-width="3"/>
  <rect x="160" y="44" width="170" height="26" rx="13" fill="#000"/>
  <g transform="translate(92 112)">
    <rect width="306" height="398" rx="18" fill="url(#metal)" stroke="#cfd5da" stroke-opacity=".7" stroke-width="8"/>
    <rect x="20" y="24" width="266" height="350" rx="10" fill="#0b1118" stroke="#D4AF37" stroke-opacity=".45" stroke-width="2"/>
    <rect x="20" y="24" width="266" height="54" rx="10" fill="#f2f3f4"/>
    <text x="42" y="58" fill="#15191d" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900">PSA 10</text>
    <circle cx="256" cy="51" r="13" fill="#c91c1c"/>
    <rect x="77" y="113" width="152" height="194" rx="70" fill="#202c38"/>
    <circle cx="153" cy="161" r="36" fill="#8f9aa4"/>
    <path d="M102 302q51-91 102 0" fill="#5b6771"/>
    <text x="153" y="336" fill="#d9dde1" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle">2020 PRIZM</text>
  </g>
</g>

<g transform="translate(905 160) rotate(7 225 330)" filter="url(#shadow)">
  <rect width="450" height="660" rx="72" fill="#020304" stroke="#2e353d" stroke-width="10"/>
  <rect x="26" y="26" width="398" height="608" rx="50" fill="#070b10"/>
  <rect x="139" y="45" width="172" height="26" rx="13" fill="#000"/>
  <text x="56" y="128" fill="#7e8791" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3">DECISION INTELLIGENCE</text>
  <text x="56" y="198" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="900">Exact card first.</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(56 238)"><rect width="338" height="72" rx="12" fill="#0b1219" stroke="#23303a"/><text x="20" y="22" fill="#68727b" font-size="12" font-weight="900" letter-spacing="2">IDENTITY</text><text x="20" y="58" fill="#D4AF37" font-size="19" font-weight="900">VERIFIED</text></g>
    <g transform="translate(56 326)"><rect width="338" height="72" rx="12" fill="#0b1219" stroke="#23303a"/><text x="20" y="22" fill="#68727b" font-size="12" font-weight="900" letter-spacing="2">EVIDENCE</text><text x="20" y="58" fill="#fff" font-size="18" font-weight="900">2 QUALIFIED / 7</text></g>
    <g transform="translate(56 414)"><rect width="338" height="72" rx="12" fill="#0b1219" stroke="#23303a"/><text x="20" y="18" fill="#68727b" font-size="11" font-weight="900" letter-spacing="2">SUPPORTED VALUE</text><text x="20" y="62" fill="#fff" font-size="20" font-weight="900">$357.20</text></g>
    <g transform="translate(56 516)"><rect width="338" height="72" rx="12" fill="#100f08" stroke="#D4AF37" stroke-opacity=".58"/><text x="20" y="18" fill="#9e8a47" font-size="11" font-weight="900" letter-spacing="2">DECISION</text><text x="20" y="63" fill="#F2D46B" font-size="24" font-weight="900" letter-spacing="3">VERIFY</text></g>
  </g>
</g>

<g transform="translate(575 158)" filter="url(#shadow)">
  <rect width="530" height="686" rx="80" fill="#020304" stroke="url(#gold)" stroke-width="7"/>
  <rect x="28" y="28" width="474" height="630" rx="54" fill="#05090e"/>
  <rect x="180" y="45" width="170" height="26" rx="13" fill="#000"/>
  <text x="64" y="132" fill="#D4AF37" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" letter-spacing="4">CARD DECISION INTELLIGENCE</text>
  <g transform="translate(130 166)">
    <rect width="270" height="370" rx="18" fill="url(#metal)" stroke="#d8dde1" stroke-width="8"/>
    <rect x="17" y="19" width="236" height="332" rx="10" fill="#0d141b"/>
    <rect x="17" y="19" width="236" height="48" rx="10" fill="#f6f7f7"/>
    <text x="34" y="49" fill="#15191d" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900">PSA 10</text>
    <circle cx="226" cy="43" r="11" fill="#c91c1c"/>
    <rect x="70" y="96" width="130" height="160" rx="58" fill="#25323e"/>
    <circle cx="135" cy="135" r="29" fill="#a6afb7"/>
    <path d="M93 250q42-72 84 0" fill="#66727d"/>
    <text x="135" y="286" fill="#f1f3f5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" text-anchor="middle">#307</text>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <text x="265" y="580" fill="#fff" font-size="23" font-weight="900">Exact identity locked</text>
    <text x="265" y="613" fill="#7d8790" font-size="16">Year · Product · Card · Parallel · Grader · Grade</text>
  </g>
</g>

<g transform="translate(430 515)" filter="url(#shadow)">
  <rect width="740" height="230" rx="28" fill="#17140c" fill-opacity=".92" stroke="url(#gold)" stroke-width="3"/>
  <rect x="26" y="26" width="688" height="178" rx="20" fill="#0b0d0f" stroke="#D4AF37" stroke-opacity=".34"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="56" y="67" fill="#987f32" font-size="14" font-weight="900" letter-spacing="3">FLIPFORGE DECISION</text>
    <text x="56" y="118" fill="#F3D775" font-size="52" font-weight="900" letter-spacing="6">VERIFY</text>
    <text x="56" y="156" fill="#b7bdc2" font-size="18" font-weight="700">Price found. Evidence tested. Value understood.</text>
    <g transform="translate(500 50)">
      <text x="0" y="0" fill="#68727b" font-size="12" font-weight="900" letter-spacing="2">SUPPORTED GAP</text>
      <text x="0" y="37" fill="#fff" font-size="29" font-weight="900">2.3%</text>
      <text x="0" y="75" fill="#68727b" font-size="12" font-weight="900" letter-spacing="2">EVIDENCE</text>
      <text x="0" y="106" fill="#fff" font-size="22" font-weight="900">2 / 7</text>
    </g>
  </g>
</g>

<text x="92" y="820" fill="#56616b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2">IDENTITY → EVIDENCE → ECONOMICS → DECISION</text>
<text x="1508" y="820" fill="#D4AF37" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" letter-spacing="3" text-anchor="end">FLIPFORGE</text>
</svg>