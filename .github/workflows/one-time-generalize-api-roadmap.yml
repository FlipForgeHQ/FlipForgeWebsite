name: One-time generalize API roadmap wording

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Replace provider-specific roadmap wording
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = '''<div class="roadmap-card"><span class="feature-label roadmap-label">Roadmap</span><h3>Card Image Recognition</h3><p>Secure integration with an authorized card-identification provider to identify uploaded card images and reconcile the result with FlipForge’s exact-identity workflow.</p></div>'''
          new = '''<div class="roadmap-card"><span class="feature-label roadmap-label">Roadmap</span><h3>Authorized Source API Expansion</h3><p>Expand secure integrations with authorized card-data, listing, pricing, identity, grading, and completed-sale APIs while keeping each provider optional, replaceable, and subject to FlipForge’s evidence and identity controls.</p></div>'''
          if old not in text:
              raise SystemExit("Expected roadmap wording was not found; no automatic replacement was made.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Remove one-time workflow
        run: rm -f .github/workflows/one-time-generalize-api-roadmap.yml

      - name: Commit website wording update
        run: |
          git config user.name "FlipForge Website Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/one-time-generalize-api-roadmap.yml
          git commit -m "Generalize authorized source API roadmap wording"
          git push
