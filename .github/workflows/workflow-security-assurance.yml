name: Workflow Security Assurance

on:
  pull_request:
    branches: [main]
  # Every push to main: the website release gate (scripts/ci/release-website.mjs) requires this check on the exact
  # commit being released, so it must exist on every main commit, not only on commits that change workflows.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-action-refs:
    name: Validate workflow action references
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: 24
      - name: Enforce workflow action reference policy
        run: node scripts/validate-workflow-action-refs.mjs
