name: Backend Runtime Identity Gateway Assurance

on:
  pull_request:
    paths:
      - 'netlify/modern-functions/flipforge-api.mjs'
      - 'scripts/validate-backend-runtime-identity-gateway.mjs'
      - '.github/workflows/backend-runtime-identity-gateway-assurance.yml'
  push:
    branches:
      - main
    paths:
      - 'netlify/modern-functions/flipforge-api.mjs'
      - 'scripts/validate-backend-runtime-identity-gateway.mjs'
      - '.github/workflows/backend-runtime-identity-gateway-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate safe backend runtime identity gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install website dependencies
        run: npm install --no-audit --no-fund
      - name: Validate runtime identity gateway
        run: node scripts/validate-backend-runtime-identity-gateway.mjs
