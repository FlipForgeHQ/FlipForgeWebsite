name: Backend Runtime Identity Gateway Assurance

on:
  pull_request:
    paths:
      - 'netlify/modern-functions/flipforge-api.mjs'
      - 'scripts/validate-backend-runtime-identity-gateway.mjs'
      - '.github/workflows/backend-runtime-identity-gateway-assurance.yml'
  push:
    branches:
      - main
    paths:
      - 'netlify/modern-functions/flipforge-api.mjs'
      - 'scripts/validate-backend-runtime-identity-gateway.mjs'
      - '.github/workflows/backend-runtime-identity-gateway-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate safe backend runtime identity gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install website dependencies
        run: npm install --no-audit --no-fund
      - name: Validate runtime identity gateway
        run: node scripts/validate-backend-runtime-identity-gateway.mjs
