name: Market View V1 UI

on:
  pull_request:
    paths:
      - 'saas-prototype/index.html'
      - 'saas-prototype/customer-market-view.js'
      - 'saas-prototype/customer-market-view.css'
      - 'saas-prototype/staging-route-hook.js'
      - 'netlify/modern-functions/market-view.mjs'
      - 'scripts/validate-market-view-v1.mjs'
      - 'package.json'
      - 'netlify.toml'
      - '.github/workflows/market-view-v1-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-market-view-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate Market View JavaScript syntax
        run: |
          node --check saas-prototype/customer-market-view.js
          node --check netlify/modern-functions/market-view.mjs

      - name: Validate Market View customer contract
        run: npm run validate:market-view
