name: SaaS Full-Site Visual QA

on:
  pull_request:
    paths:
      - "saas-prototype/**"
      - "scripts/build-identity-client.mjs"
      - "scripts/audit-saas-layout-ci.mjs"
      - "scripts/audit-saas-layout.mjs"
      - "scripts/audit-mobile-navigation-ci.mjs"
      - "scripts/audit-mobile-guided-mode-ci.mjs"
      - "scripts/audit-discover-identity-assist-ci.mjs"
      - "scripts/audit-discover-results-first-ci.mjs"
      - "scripts/audit-customer-typography-ci.mjs"
      - "scripts/check-saas-layout-report.mjs"
      - ".github/workflows/saas-full-site-visual-qa.yml"
      - "scripts/ci/install-playwright-chromium.sh"
  push:
    branches:
      - main
    paths:
      - "saas-prototype/**"
      - "scripts/build-identity-client.mjs"
      - "scripts/audit-saas-layout-ci.mjs"
      - "scripts/audit-saas-layout.mjs"
      - "scripts/audit-mobile-navigation-ci.mjs"
      - "scripts/audit-mobile-guided-mode-ci.mjs"
      - "scripts/audit-discover-identity-assist-ci.mjs"
      - "scripts/audit-discover-results-first-ci.mjs"
      - "scripts/audit-customer-typography-ci.mjs"
      - "scripts/check-saas-layout-report.mjs"
      - ".github/workflows/saas-full-site-visual-qa.yml"
      - "scripts/ci/install-playwright-chromium.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual-layout-audit:
    name: Audit built SaaS routes at desktop tablet and mobile widths
    runs-on: ubuntu-24.04
    timeout-minutes: 14

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install website dependencies
        run: npm install --no-audit --no-fund

      - name: Build production app assets
        run: npm run build:identity

      - name: Install Playwright for browser QA
        run: bash scripts/ci/install-playwright-chromium.sh

      - name: Start local SaaS preview at production app path
        run: |
          node saas-prototype/serve.mjs > /tmp/flipforge-saas-layout-server.log 2>&1 &
          echo $! > /tmp/flipforge-saas-layout-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/flipforge-saas-layout-server.log
          exit 1

      - name: Build full-site layout report
        continue-on-error: true
        run: node scripts/audit-saas-layout-ci.mjs

      - name: Gate actionable layout and Dashboard semantic failures
        run: node scripts/check-saas-layout-report.mjs

      - name: Gate mobile navigation taps
        run: node scripts/audit-mobile-navigation-ci.mjs

      - name: Gate mobile Guided Mode behavior
        run: node scripts/audit-mobile-guided-mode-ci.mjs

      - name: Gate Discover imperfect-identity resolution
        run: node scripts/audit-discover-identity-assist-ci.mjs

      - name: Gate results-first Evaluate flow
        run: node scripts/audit-discover-results-first-ci.mjs

      - name: Gate uniform customer typography floor
        run: node scripts/audit-customer-typography-ci.mjs

      - name: Upload layout and typography audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flipforge-saas-full-site-layout-audit
          path: |
            qa-artifacts/saas-layout
            qa-artifacts/customer-typography
          if-no-files-found: warn
          retention-days: 14

      - name: Show preview-server log on failure
        if: failure()
        run: cat /tmp/flipforge-saas-layout-server.log || true
