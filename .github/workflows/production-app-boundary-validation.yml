name: Production App Boundary Validation

on:
  pull_request:
    paths:
      - "saas-prototype/**"
      - "scripts/build-identity-client.mjs"
      - "scripts/lib/production-app-boundary.mjs"
      - "scripts/validate-netlify-identity-modernization.mjs"
      - "scripts/validate-homepage-progression.mjs"
      - "scripts/lib/deploy-manifest.mjs"
      - "scripts/write-deploy-manifest.mjs"
      - "scripts/validate-deploy-manifest.mjs"
      - "package.json"
      - "netlify.toml"
      - ".github/workflows/production-app-boundary-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-boundary:
    name: Run exact Netlify production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CONTEXT: production
      BRANCH: main
      COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install website build dependencies
        run: npm install --no-audit --no-fund

      - name: Run exact Netlify production command
        run: npm run build:identity && npm run validate:identity && npm run build:paddle-live && npm run validate:paddle-live-payment-link && npm run validate:account-lifecycle && npm run validate:customer-intelligence && npm run validate:card-intelligence-result-priority && npm run validate:card-intelligence-detail-route && npm run validate:customer-dashboard && npm run validate:production-prototype-isolation && npm run validate:customer-compare && npm run validate:customer-management && npm run validate:customer-portfolio && npm run validate:customer-lifecycle && npm run validate:customer-export && npm run validate:customer-discovery && npm run validate:market-view && npm run validate:cardsight-evidence-visibility && npm run validate:price-intelligence && npm run validate:customer-entitlements && npm run validate:evaluation-quota-boundary && npm run validate:private-beta-operations-boundary && npm run validate:paddle-customer-checkout && npm run validate:paddle-customer-portal && npm run validate:paddle-webhook-gateway-boundary && npm run validate:private-beta && npm run validate:homepage-progression && npm run validate:beta-acquisition && npm run validate:beta-operator && node scripts/build-assets.js && node scripts/validate-brand-assets.js && npm run build:deploy-manifest && npm run validate:deploy-manifest

      - name: Assert preview-only staging diagnostics are absent
        run: |
          ! grep -q 'src="staging-browser.js"' saas-prototype/index.html
          ! grep -q 'href="staging-browser.css"' saas-prototype/index.html
          ! grep -q 'data-route="staging"' saas-prototype/index.html
          ! grep -q 'data-route="staging-evaluate"' saas-prototype/index.html

      - name: Assert required customer production runtime remains
        run: |
          grep -q 'src="/assets/js/flipforge-identity.js"' saas-prototype/index.html
          grep -q 'src="/assets/js/flipforge-production-signin.js"' saas-prototype/index.html
          grep -q 'src="production-dashboard-guard.js"' saas-prototype/index.html
          grep -q 'src="staging-evaluation.js"' saas-prototype/index.html
          grep -q 'src="staging-route-hook.js"' saas-prototype/index.html
          grep -q 'src="customer-opportunities.js"' saas-prototype/index.html
          grep -q 'src="customer-opportunities-bridge.js"' saas-prototype/index.html

      - name: Assert production deployment manifest matches build
        run: node -e 'const m=require("./deploy-meta.json"); if(m.context!=="production"||m.production!==true||m.commitRef!==process.env.COMMIT_REF||m.appBoundary!=="PRODUCTION_SERVER_OWNED_FAIL_CLOSED"||m.transactionAuthority!==false) process.exit(1)'
