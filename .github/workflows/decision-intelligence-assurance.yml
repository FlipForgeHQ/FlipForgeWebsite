name: Decision Intelligence Assurance

on:
  pull_request:
    paths:
      - "saas-prototype/index.html"
      - "saas-prototype/customer-ui-system-v1.css"
      - "saas-prototype/decision-intelligence-server-v1.css"
      - "saas-prototype/decision-intelligence-v1.js"
      - "saas-prototype/validate-decision-intelligence.mjs"
      - ".github/workflows/decision-intelligence-assurance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Protect SaaS presentation authority
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Parse Decision Intelligence runtime
        run: node --check saas-prototype/decision-intelligence-v1.js

      - name: Validate Decision Intelligence contract
        run: node saas-prototype/validate-decision-intelligence.mjs
