name: Netlify Build Mirror

on:
  pull_request:
    paths:
      - "saas-prototype/**"
      - "scripts/**"
      - "checkout/**"
      - "assets/**"
      - "netlify.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/netlify-build-mirror.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CONTEXT: deploy-preview
      BRANCH: design/global-readability-v1
      COMMIT_REF: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run Netlify build command
        run: >-
          npm run build:identity &&
          npm run validate:identity &&
          npm run build:paddle-live &&
          npm run validate:paddle-live-payment-link &&
          npm run validate:account-lifecycle &&
          npm run validate:customer-intelligence &&
          npm run validate:card-intelligence-result-priority &&
          npm run validate:card-intelligence-detail-route &&
          npm run validate:customer-dashboard &&
          npm run validate:production-prototype-isolation &&
          npm run validate:production-route-authority &&
          node scripts/validate-native-evidence-links.mjs &&
          npm run validate:customer-compare &&
          npm run validate:customer-management &&
          npm run validate:customer-portfolio &&
          npm run validate:customer-lifecycle &&
          npm run validate:customer-export &&
          npm run validate:customer-discovery &&
          npm run validate:market-view &&
          npm run validate:cardsight-evidence-visibility &&
          npm run validate:price-intelligence &&
          npm run validate:customer-entitlements &&
          npm run validate:evaluation-quota-boundary &&
          npm run validate:private-beta-operations-boundary &&
          npm run validate:paddle-customer-checkout &&
          npm run validate:paddle-customer-portal &&
          npm run validate:paddle-webhook-gateway-boundary &&
          npm run validate:private-beta &&
          npm run validate:homepage-progression &&
          npm run validate:beta-acquisition &&
          npm run validate:beta-operator &&
          node scripts/build-assets.js &&
          node scripts/validate-brand-assets.js &&
          npm run build:deploy-manifest &&
          npm run validate:deploy-manifest
