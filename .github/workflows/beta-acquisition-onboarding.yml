name: Beta Acquisition and Onboarding

on:
  pull_request:
    paths:
      - "beta-application.html"
      - "thank-you.html"
      - "beta-onboarding.html"
      - "privacy.html"
      - "assets/js/conversion-events.js"
      - "assets/css/beta-onboarding-v1.css"
      - "netlify/modern-functions/conversion-event.mjs"
      - "scripts/validate-beta-acquisition-onboarding.mjs"
      - "docs/PRIVATE_BETA_ACQUISITION_AND_ONBOARDING.md"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - ".github/workflows/beta-acquisition-onboarding.yml"
  push:
    branches:
      - main
    paths:
      - "beta-application.html"
      - "thank-you.html"
      - "beta-onboarding.html"
      - "privacy.html"
      - "assets/js/conversion-events.js"
      - "assets/css/beta-onboarding-v1.css"
      - "netlify/modern-functions/conversion-event.mjs"
      - "scripts/validate-beta-acquisition-onboarding.mjs"
      - "docs/PRIVATE_BETA_ACQUISITION_AND_ONBOARDING.md"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - ".github/workflows/beta-acquisition-onboarding.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Parse browser JavaScript
        run: node --check assets/js/conversion-events.js
      - name: Validate beta acquisition and onboarding
        run: node scripts/validate-beta-acquisition-onboarding.mjs
