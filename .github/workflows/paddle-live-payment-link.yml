name: Paddle Live Payment Link

on:
  pull_request:
    paths:
      - "checkout/**"
      - "scripts/build-paddle-live-config.mjs"
      - "scripts/validate-paddle-live-payment-link.mjs"
      - "docs/PADDLE_LIVE_PAYMENT_LINK.md"
      - "package.json"
      - "netlify.toml"
      - ".github/workflows/paddle-live-payment-link.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Paddle Live payment link
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build fail-closed browser config
        run: npm run build:paddle-live
      - name: Validate payment-link boundary
        run: npm run validate:paddle-live-payment-link
