name: Apply Pro Plan Feature Display

on:
  push:
    branches: [agent/pro-plan-feature-display]
    paths:
      - '.github/workflows/apply-pro-plan-feature-display.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pro-plan-feature-display
      - name: Add server-owned Forge Heat plan feature
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('saas-prototype/customer-entitlements.js')
          text = path.read_text()
          old = '${planFeature("PSA intelligence", plan.psaIntelligence)}${planFeature("CSV exports", plan.csvExports)}'
          new = '${planFeature("PSA intelligence", plan.psaIntelligence)}${planFeature("Forge Heat", plan.forgeHeat === true)}${planFeature("CSV exports", plan.csvExports)}'
          if old not in text:
              raise SystemExit('Expected plan feature sequence not found')
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one plan feature sequence')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "FlipForge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add saas-prototype/customer-entitlements.js
          git commit -m "Show Forge Heat in customer plan cards"
          git push origin HEAD:agent/pro-plan-feature-display
