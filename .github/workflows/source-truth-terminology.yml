name: Source-Truth Terminology

# Customer text must never claim or imply that a sale is verified, confirmed, trusted or payment-confirmed.
# FlipForge shows reported sale records matched to the exact card; it does not confirm payment or settlement.
# Runs on every pull request (no path filter) so new copy anywhere on the site or in the app is checked.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-truth-terminology:
    name: No verified, confirmed or trusted sale claims in customer text
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Validate source-truth terminology and payment-limitation disclosures (also no provider name, no verified or trusted labels, no rewrite tables that add them)
        run: node scripts/validate-source-truth-terminology.mjs
      - name: Validate customer trust display helpers (saved risk and confidence, legacy results, source wording, withheld prices)
        run: node scripts/validate-customer-trust-display.mjs
      - name: Install Playwright Chromium
        run: bash scripts/ci/install-playwright-chromium.sh
      - name: Legacy evidence headings are still read (current and legacy labels)
        run: node scripts/audit-legacy-evidence-labels-ci.mjs
