name: Deploy approved FlipForge homepage hero

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update homepage hero
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = "/* FLIPFORGE_APPROVED_HERO */"

          css = r'''
    /* FLIPFORGE_APPROVED_HERO */
    .hero.approved-hero{min-height:690px;grid-template-columns:minmax(0,.9fr) minmax(540px,1.1fr);gap:44px;padding-top:64px;padding-bottom:58px}
    .approved-hero h1{font-size:clamp(44px,5.2vw,70px);line-height:1.03;letter-spacing:-.035em;text-transform:none;max-width:650px}
    .approved-hero .hero-lead{font-size:18px;line-height:1.72;max-width:640px}
    .hero-period{color:var(--gold)}
    .approved-hero .btn{border-radius:8px;min-height:48px}
    .approved-hero .btn.primary{background:linear-gradient(135deg,var(--gold2),var(--gold))}
    .hero-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:34px;padding-top:24px;border-top:1px solid rgba(212,175,55,.28)}
    .hero-flow div{position:relative;min-width:0}
    .hero-flow div:not(:last-child):after{content:'›';position:absolute;right:-3px;top:8px;color:var(--gold);font-size:23px}
    .hero-flow b{display:grid;place-items:center;width:35px;height:35px;margin-bottom:9px;border:1px solid rgba(212,175,55,.42);color:var(--gold2);font-size:12px}
    .hero-flow strong{display:block;color:var(--gold2);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
    .hero-flow span{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:3px}

    .hero-console{position:relative;padding:19px;border:1px solid rgba(212,175,55,.36);background:linear-gradient(rgba(212,175,55,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.04) 1px,transparent 1px),linear-gradient(180deg,#0b1728,#030812);background-size:27px 27px,27px 27px,auto;box-shadow:0 28px 85px rgba(0,0,0,.45)}
    .hero-console:before,.hero-console:after{content:'';position:absolute;width:28px;height:28px;border-color:rgba(245,246,247,.58)}
    .hero-console:before{left:9px;top:9px;border-left:2px solid;border-top:2px solid}
    .hero-console:after{right:9px;bottom:9px;border-right:2px solid;border-bottom:2px solid}
    .console-grid{position:relative;z-index:1;display:grid;grid-template-columns:.9fr 1.12fr .9fr;gap:9px}
    .console-panel{min-width:0;padding:14px;border:1px solid rgba(255,255,255,.15);background:linear-gradient(180deg,rgba(15,28,46,.97),rgba(5,11,20,.97))}
    .console-title{display:flex;align-items:center;gap:7px;margin-bottom:13px;color:var(--text);font-size:8px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
    .console-icon{display:grid;place-items:center;width:19px;height:19px;border:1px solid rgba(212,175,55,.46);color:var(--gold2)}
    .identity-card{padding:9px;border:1px solid rgba(245,246,247,.25);background:#040912}
    .identity-label{display:flex;justify-content:space-between;gap:6px;padding:7px;background:#f2f2f2;color:#07101b;font-size:7px;font-weight:900;text-transform:uppercase}
    .identity-face{min-height:135px;display:grid;place-items:center;margin-top:8px;border:1px solid rgba(255,255,255,.13);background:radial-gradient(circle,rgba(212,175,55,.18),transparent 46%),linear-gradient(135deg,#122139,#040912)}
    .identity-face svg{width:68px;height:68px}
    .console-list{display:grid;gap:7px;margin-top:11px}
    .console-row{display:flex;justify-content:space-between;gap:7px;padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.09);color:var(--muted);font-size:8px;line-height:1.35}
    .console-row strong{color:var(--copy);text-align:right}.ok{color:var(--green)!important}.gold{color:var(--gold2)!important}
    .evidence-box{padding:10px;margin-bottom:9px;border:1px solid rgba(255,255,255,.12);background:rgba(3,8,18,.52)}
    .evidence-box header{position:static;display:flex;justify-content:space-between;gap:8px;border:0;background:none;backdrop-filter:none;color:var(--copy);font-size:8px}
    .bars{height:25px;display:flex;align-items:flex-end;gap:3px;margin-top:7px}.bars i{flex:1;background:var(--green)}.bars.gold-bars i{background:var(--gold)}
    .confidence{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:10px;border:1px solid rgba(255,255,255,.13)}
    .confidence small{display:block;color:var(--muted);font-size:7px;text-transform:uppercase}.confidence strong{color:var(--green);font-size:19px}
    .ring{width:38px;height:38px;border-radius:50%;border:6px solid rgba(79,210,139,.2);border-top-color:var(--green);border-right-color:var(--green)}
    .outcomes{display:grid;gap:8px}.outcome{display:flex;justify-content:space-between;align-items:center;min-height:49px;padding:9px;border:1px solid rgba(255,255,255,.17);background:rgba(3,8,18,.48)}
    .outcome strong{display:block;font-size:13px;letter-spacing:.07em}.outcome span{display:block;color:var(--muted);font-size:7px;margin-top:2px}.outcome.buy{border-color:rgba(79,210,139,.64)}.outcome.buy strong{color:var(--green)}.outcome.watch{border-color:rgba(212,175,55,.64)}.outcome.watch strong{color:var(--gold2)}
    .console-note{position:relative;z-index:1;margin-top:12px;color:var(--muted);font-size:8px;text-align:center}

    @media(max-width:1080px){.hero.approved-hero{grid-template-columns:1fr;min-height:auto}.hero-console{max-width:760px;width:100%;margin:auto}}
    @media(max-width:720px){.console-grid{grid-template-columns:1fr}.identity-face{min-height:120px}}
    @media(max-width:600px){.approved-hero h1{font-size:clamp(39px,12vw,54px)}.approved-hero .hero-lead{font-size:16px}.hero-flow{grid-template-columns:repeat(2,1fr);gap:17px 11px}.hero-flow div:nth-child(2):after{display:none}.hero-console{padding:13px}}
'''

          if marker not in text:
              anchor = "    @media(max-width:1080px){"
              if anchor not in text:
                  raise SystemExit("CSS anchor not found")
              text = text.replace(anchor, css + "\n" + anchor, 1)

          hero = r'''
  <section class="hero approved-hero" aria-labelledby="hero-title">
    <div>
      <div class="kicker">Sports Card Decision Intelligence</div>
      <h1 id="hero-title">Turn market noise into smarter collecting decisions<span class="hero-period">.</span></h1>
      <p class="hero-lead">FlipForge<span class="tm">™</span> helps collectors discover opportunities, validate evidence, and act with confidence—without hiding uncertainty behind a single price estimate.</p>
      <div class="buttons">
        <a class="btn primary" href="#workflow">See How It Works</a>
        <a class="btn" href="#platform">Explore the Platform</a>
        <a class="btn" href="#access">Request Private-Beta Access</a>
      </div>
      <div class="hero-flow" aria-label="Discovery, evidence, validation, and outcomes">
        <div><b>01</b><strong>Discovery</strong><span>Surface what matters.</span></div>
        <div><b>02</b><strong>Evidence</strong><span>Organize trusted data.</span></div>
        <div><b>03</b><strong>Validation</strong><span>Confirm what is real.</span></div>
        <div><b>04</b><strong>Outcomes</strong><span>Make a clearer decision.</span></div>
      </div>
    </div>

    <div class="hero-console" aria-label="Illustrative FlipForge decision workflow">
      <div class="console-grid">
        <article class="console-panel">
          <div class="console-title"><span class="console-icon">◆</span>Exact Identity</div>
          <div class="identity-card">
            <div class="identity-label"><span>Identity locked</span><span>Exact match</span></div>
            <div class="identity-face">
              <svg viewBox="0 0 64 64" aria-hidden="true">
                <path d="M14 14H30V23H23V30H14V14Z" fill="#f5f6f7"/><path d="M34 14H50V30H41V23H34V14Z" fill="#f5f6f7"/><path d="M14 34H23V41H30V50H14V34Z" fill="#f5f6f7"/><path d="M41 34H50V50H34V41H41V34Z" fill="#f5f6f7"/><rect x="28" y="28" width="8" height="8" fill="#d4af37"/>
              </svg>
            </div>
          </div>
          <div class="console-list"><div class="console-row"><span>Year + Set</span><strong class="ok">Verified</strong></div><div class="console-row"><span>Player + Number</span><strong class="ok">Matched</strong></div><div class="console-row"><span>Parallel + Grade</span><strong class="ok">Confirmed</strong></div></div>
        </article>

        <article class="console-panel">
          <div class="console-title"><span class="console-icon">•••</span>Evidence + Validation</div>
          <div class="evidence-box"><header><span>Completed Sales</span><strong class="ok">Separated</strong></header><div class="bars"><i style="height:24%"></i><i style="height:43%"></i><i style="height:35%"></i><i style="height:62%"></i><i style="height:77%"></i><i style="height:92%"></i></div></div>
          <div class="evidence-box"><header><span>Asking Prices</span><strong class="gold">Context Only</strong></header><div class="bars gold-bars"><i style="height:68%"></i><i style="height:45%"></i><i style="height:75%"></i><i style="height:54%"></i><i style="height:38%"></i><i style="height:61%"></i></div></div>
          <div class="console-list"><div class="console-row"><span>Mismatch Screening</span><strong class="ok">Active</strong></div><div class="console-row"><span>Evidence Quality</span><strong class="ok">Traceable</strong></div><div class="console-row"><span>Risk Signals</span><strong class="gold">Visible</strong></div></div>
          <div class="confidence"><div><small>Decision confidence</small><strong>Supported</strong></div><div class="ring"></div></div>
        </article>

        <article class="console-panel">
          <div class="console-title"><span class="console-icon">■</span>Decision Outcomes</div>
          <div class="outcomes"><div class="outcome buy"><div><strong>BUY</strong><span>Evidence supports opportunity.</span></div><b>›</b></div><div class="outcome watch"><div><strong>WATCH</strong><span>Monitor price or evidence.</span></div><b>›</b></div><div class="outcome"><div><strong>PASS</strong><span>Risk outweighs potential.</span></div><b>›</b></div><div class="outcome"><div><strong>GRADE</strong><span>Review grading upside.</span></div><b>›</b></div></div>
          <div class="console-list"><div class="console-row"><span>Confidence</span><strong>Visible</strong></div><div class="console-row"><span>Risk</span><strong>Explained</strong></div><div class="console-row"><span>Value Support</span><strong>Evidence-based</strong></div></div>
        </article>
      </div>
      <div class="console-note">Illustrative decision workflow. FlipForge does not automatically bid, buy, or complete transactions.</div>
    </div>
  </section>'''

          pattern = re.compile(r'  <section class="hero(?: [^"]*)?".*?\n  </section>', re.S)
          text, count = pattern.subn(hero, text, count=1)
          if count != 1:
              raise SystemExit(f"Hero replacement count was {count}")

          old_roadmap = '<div class="roadmap-card"><span class="feature-label roadmap-label">Roadmap</span><h3>Card Image Recognition</h3><p>Secure integration with an authorized card-identification provider to identify uploaded card images and reconcile the result with FlipForge’s exact-identity workflow.</p></div>'
          new_roadmap = '<div class="roadmap-card"><span class="feature-label roadmap-label">Roadmap</span><h3>Authorized Source API Expansion</h3><p>Expand secure integrations with authorized card-data, listing, pricing, identity, grading, and completed-sale APIs while keeping each provider optional, replaceable, and subject to FlipForge’s evidence and identity controls.</p></div>'
          text = text.replace(old_roadmap, new_roadmap, 1)
          path.write_text(text, encoding="utf-8")

      - name: Remove one-time workflows
        run: rm -f .github/workflows/one-time-homepage-hero-v2.yml .github/workflows/one-time-generalize-api-roadmap.yml

      - name: Commit live homepage update
        run: |
          git config user.name "FlipForge Website Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows
          git commit -m "Deploy approved responsive FlipForge homepage hero"
          git push