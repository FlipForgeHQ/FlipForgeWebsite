name: Customer Readability

on:
  pull_request:
    paths:
      - "saas-prototype/**"
      - "scripts/validate-customer-readability.mjs"
      - "scripts/validate-customer-ux-redundancy.mjs"
      - "scripts/audit-customer-typography-ci.mjs"
      - ".github/workflows/customer-readability.yml"
      - ".github/workflows/saas-full-site-visual-qa.yml"
  push:
    branches: [main]
    paths:
      - "saas-prototype/**"
      - "scripts/validate-customer-readability.mjs"
      - "scripts/validate-customer-ux-redundancy.mjs"
      - "scripts/audit-customer-typography-ci.mjs"
      - ".github/workflows/customer-readability.yml"
      - ".github/workflows/saas-full-site-visual-qa.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate customer readability scale
        run: node scripts/validate-customer-readability.mjs
      - name: Block redundant instructions and competing hierarchy
        run: node scripts/validate-customer-ux-redundancy.mjs
