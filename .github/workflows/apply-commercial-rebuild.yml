name: Apply commercial website rebuild

on:
  push:
    paths:
      - '.site-payload/ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply website payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .site-payload/ready ]]; then
            echo "No ready marker. Nothing to apply."
            exit 0
          fi
          count=$(find .site-payload -maxdepth 1 -type f -name 'chunk-*' | wc -l | tr -d ' ')
          if [[ "$count" != "6" ]]; then
            echo "Expected 6 payload chunks, found $count"
            exit 1
          fi
          cat .site-payload/chunk-* > /tmp/flipforge-site.b64
          base64 --decode /tmp/flipforge-site.b64 > /tmp/flipforge-site.zip
          unzip -oq /tmp/flipforge-site.zip -d .
          rm -rf .site-payload

      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          import xml.etree.ElementTree as ET

          class Parser(HTMLParser):
              pass

          root = Path('.')
          required = [
              'index.html', 'product.html', 'pricing.html', 'about.html',
              'faq.html', 'beta-application.html', 'privacy.html',
              'terms.html', 'beta-terms.html', 'data-use.html',
              'assets/css/site.css', 'assets/js/site.js',
              'assets/brand/flipforge-mark.svg', 'robots.txt',
              'sitemap.xml', 'site.webmanifest'
          ]
          missing = [path for path in required if not (root / path).exists()]
          if missing:
              raise SystemExit(f'Missing generated files: {missing}')
          for path in root.glob('*.html'):
              parser = Parser()
              parser.feed(path.read_text(encoding='utf-8'))
          ET.parse(root / 'sitemap.xml')
          json.loads((root / 'site.webmanifest').read_text(encoding='utf-8'))
          print('Generated site validation passed')
          PY
          node --check assets/js/site.js

      - name: Commit rebuilt website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-commercial-rebuild.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No website changes to commit."
            exit 0
          fi
          git commit -m "Apply commercial-readiness website rebuild"
          git push
