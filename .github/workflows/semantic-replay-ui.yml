name: Semantic Replay UI Audit

on:
  pull_request:
    paths:
      - "saas-prototype/**"
      - "scripts/audit-semantic-replay-ui-ci.mjs"
      - "package.json"
      - ".github/workflows/semantic-replay-ui.yml"
  push:
    branches:
      - main
    paths:
      - "saas-prototype/**"
      - "scripts/audit-semantic-replay-ui-ci.mjs"
      - "package.json"
      - ".github/workflows/semantic-replay-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-replay-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-replay-ui:
    name: Already-evaluated notice for server semantic replay
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install website dependencies
        run: npm install --no-audit --no-fund

      - name: Build production Identity assets
        run: npm run build:identity

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production-path app server
        run: |
          node saas-prototype/serve.mjs > /tmp/flipforge-semantic-replay-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/flipforge-semantic-replay-server.log
          exit 1

      - name: Run semantic replay UI audit
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app
        run: node scripts/audit-semantic-replay-ui-ci.mjs
