name: Apply Advanced Analysis Navigation

on:
  push:
    branches: [agent/consumer-pro-navigation]
    paths:
      - '.github/workflows/apply-advanced-analysis-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consumer-pro-navigation
      - name: Mount collapsed advanced analysis group
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('saas-prototype/index.html')
          text = path.read_text()
          css_marker = '  <link rel="stylesheet" href="customer-forge-heat.css">\n'
          css_tag = '  <link rel="stylesheet" href="consumer-pro-navigation.css">\n'
          if css_tag not in text:
              if css_marker not in text:
                  raise SystemExit('Forge Heat stylesheet marker missing')
              text = text.replace(css_marker, css_marker + css_tag, 1)
          old = '''        <a href="#/beta-start" data-route="beta-start"><span aria-hidden="true">✓</span>Getting Started</a>
        <a href="#/staging" data-route="staging" class="staging-only-nav" hidden><span aria-hidden="true">↯</span>Staging Data</a>'''
          new = '''        <a href="#/beta-start" data-route="beta-start"><span aria-hidden="true">✓</span>Getting Started</a>
        <details class="ff-advanced-nav">
          <summary>Advanced analysis</summary>
          <div class="ff-advanced-nav-links">
            <a href="#/compare" data-route="compare"><span aria-hidden="true">⇄</span>Compare</a>
            <a href="#/psa-advisor" data-route="psa-advisor"><span aria-hidden="true">A+</span>PSA Advisor</a>
            <a href="#/evidence" data-route="evidence"><span aria-hidden="true">◎</span>Evidence</a>
            <a href="#/sell" data-route="sell"><span aria-hidden="true">$</span>Exit Review</a>
            <a href="#/export" data-route="export"><span aria-hidden="true">⇩</span>Audit Export</a>
          </div>
        </details>
        <a href="#/staging" data-route="staging" class="staging-only-nav" hidden><span aria-hidden="true">↯</span>Staging Data</a>'''
          if old not in text:
              raise SystemExit('Focused nav insertion marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit navigation mount
        run: |
          git config user.name "FlipForge Automation"
          git config user.email "actions@users.noreply.github.com"
          git add saas-prototype/index.html
          git commit -m "Collapse advanced tools under analysis menu"
          git push origin HEAD:agent/consumer-pro-navigation
