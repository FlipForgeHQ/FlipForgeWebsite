name: Phase 7 Frozen Template Assurance

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'phase7-day0-template.csv'
      - 'phase7-day0-run.html'
      - 'scripts/validate-phase7-frozen-template.mjs'
      - '.github/workflows/phase7-frozen-template-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate frozen Day-0 template and operator guide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact frozen target mirror
        run: node scripts/validate-phase7-frozen-template.mjs
      - name: Validate Day-0 guide follows private preflight and selector workflow
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SaaSProofDay0ListingSelectionOperator preflight' phase7-day0-run.html
          grep -q 'ready=true' phase7-day0-run.html
          grep -q 'SaaSProofDay0ListingSelectionOperator select' phase7-day0-run.html
          grep -q '/data/phase7-day0-selected.csv' phase7-day0-run.html
          grep -q '/.netlify/functions/bulk-evaluate' phase7-day0-run.html
          grep -q 'SaaSProofCohortOperator create25' phase7-day0-run.html
          grep -q '/phase7-day0-template.csv' phase7-day0-run.html
          grep -q 'separate identity preflight' phase7-day0-run.html
          ! grep -q 'For each frozen target, select the current eligible' phase7-day0-run.html
          ! grep -q 'Fill only the live fields' phase7-day0-run.html
          ! grep -Eqi 'fetch\(|localStorage|sessionStorage|indexedDB|supportedValue|forgeHeat|recommendation[[:space:]]*=' phase7-day0-run.html
          echo 'PASS: Day-0 guide requires hosted provider preflight before private selection and contains no browser decision logic.'
