name: Phase 7 Frozen Template Assurance

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'phase7-day0-template.csv'
      - 'phase7-day0-run.html'
      - 'docs/phase7-day0-proof-capture.md'
      - 'scripts/validate-phase7-frozen-template.mjs'
      - '.github/workflows/phase7-frozen-template-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate frozen Day-0 template and locked operator guide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact frozen target mirror
        run: node scripts/validate-phase7-frozen-template.mjs
      - name: Validate Day-0 guide follows locked prospective-proof workflow
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SaaSProofDay0ListingSelectionOperator preflight' phase7-day0-run.html
          grep -q 'ready=true' phase7-day0-run.html
          grep -q 'SaaSProofDay0ListingSelectionOperator select' phase7-day0-run.html
          grep -q -- '--format json' phase7-day0-run.html
          grep -q 'sha256sum' phase7-day0-run.html
          grep -q 'SaaSProofDay0ListingSelectionOperator export-locked' phase7-day0-run.html
          grep -q '0c9373ea0619a44d8168ecfc10e28d8c8bae5aeb66dc5458141d0f7b36b30c1f' phase7-day0-run.html
          grep -q '/.netlify/functions/bulk-evaluate' phase7-day0-run.html
          grep -q 'separate identity preflight' phase7-day0-run.html
          grep -q 'flipforge-phase7-day0-proof-ids.json' phase7-day0-run.html
          grep -q 'SaaSProofDay0CohortFreezeOperator freeze25' phase7-day0-run.html
          grep -q -- '--proof-export-file /data/proof/flipforge-phase7-day0-proof-ids.json' phase7-day0-run.html
          grep -q 'phase7LockedSelectionVerified=true' phase7-day0-run.html
          grep -q 'phase7ProofIdExportVerified=true' phase7-day0-run.html
          grep -q 'phase7ProofIdExportSha256' phase7-day0-run.html
          grep -q 'phase7VerifiedRequestCount=25' phase7-day0-run.html
          grep -q '/phase7-day0-template.csv' phase7-day0-run.html
          ! grep -q 'SaaSProofCohortOperator create25' phase7-day0-run.html
          ! grep -q 'repeat --request-id exactly 25 times' phase7-day0-run.html
          ! grep -q 'select --format csv' phase7-day0-run.html
          ! grep -q '/data/phase7-day0-selected.csv' phase7-day0-run.html
          ! grep -q 'For each frozen target, select the current eligible' phase7-day0-run.html
          ! grep -q 'Fill only the live fields' phase7-day0-run.html
          ! grep -Eqi 'fetch\(|localStorage|sessionStorage|indexedDB|supportedValue|forgeHeat|recommendation[[:space:]]*=' phase7-day0-run.html
          grep -q 'SaaSProofDay0CohortFreezeOperator freeze25' docs/phase7-day0-proof-capture.md
          grep -q -- '--proof-export-file /data/proof/flipforge-phase7-day0-proof-ids.json' docs/phase7-day0-proof-capture.md
          grep -q 'phase7ProofIdExportVerified=true' docs/phase7-day0-proof-capture.md
          grep -q 'phase7ProofIdExportSha256' docs/phase7-day0-proof-capture.md
          ! grep -q 'Authoritative cohort membership remains in FlipForge SQLite and is created only through the private backend `SaaSProofCohortOperator create25` path' docs/phase7-day0-proof-capture.md
          echo 'PASS: Day-0 guide requires locked selection export, direct proof-ID handoff, and locked cohort freeze with no browser decision logic.'
