name: SaaS Core Production Loop

on:
  pull_request:
    paths:
      - "saas-prototype/index.html"
      - "saas-prototype/staging-evaluation.js"
      - "saas-prototype/customer-opportunities.js"
      - "saas-prototype/customer-opportunities-bridge.js"
      - "saas-prototype/customer-discovery.js"
      - "saas-prototype/customer-compare.js"
      - "saas-prototype/customer-lifecycle.js"
      - "saas-prototype/customer-management.js"
      - "saas-prototype/customer-portfolio.js"
      - "saas-prototype/customer-export.js"
      - "saas-prototype/staging-route-hook.js"
      - "netlify/functions/flipforge-api.js"
      - "scripts/validate-saas-core-production-loop.mjs"
      - "scripts/validate-saas-card-intelligence-value-context.mjs"
      - ".github/workflows/saas-core-production-loop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-production-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse production customer adapters
        run: |
          node --check saas-prototype/customer-opportunities.js
          node --check scripts/validate-saas-card-intelligence-value-context.mjs
      - name: Validate production customer loop
        run: node scripts/validate-saas-core-production-loop.mjs
      - name: Validate saved Card Intelligence value context
        run: node scripts/validate-saas-card-intelligence-value-context.mjs
      - name: Enforce saved value authority boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'value.recommendationAuthority === false' saas-prototype/customer-opportunities.js
          grep -Fq 'value.priceAdjustmentApplied === false' saas-prototype/customer-opportunities.js
          grep -Fq 'VALUE_INTELLIGENCE_CONTRACT_INVALID' saas-prototype/customer-opportunities.js
          grep -Fq 'Not a supported value' saas-prototype/customer-opportunities.js
          ! grep -Eq 'reference(Low|Midpoint|High)Cents[[:space:]]*=' saas-prototype/customer-opportunities.js
