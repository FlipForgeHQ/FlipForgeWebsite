name: Consumer Pro Navigation

on:
  pull_request:
    paths:
      - 'saas-prototype/index.html'
      - 'scripts/validate-consumer-pro-navigation.mjs'
      - '.github/workflows/consumer-pro-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'saas-prototype/index.html'
      - 'scripts/validate-consumer-pro-navigation.mjs'
      - '.github/workflows/consumer-pro-navigation.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consumer-pro-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Validate focused customer workflow
        run: node scripts/validate-consumer-pro-navigation.mjs
