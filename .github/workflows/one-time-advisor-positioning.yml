name: One-time purchase advisor positioning

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-advisor-positioning:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Position FlipForge as the collector's purchase advisor
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '<meta name="description" content="FlipForge helps collectors confirm exact card identity, validate market evidence, evaluate grading economics, and make clearer BUY, WATCH, VERIFY, PASS, or GRADE decisions.">',
                  '<meta name="description" content="FlipForge is a sports-card purchase advisor that guides collectors through identity, evidence, pricing, grading economics, risk, and the next decision before they buy.">'
              ),
              (
                  '<a href="#proof">Try It</a><a href="#workflow">How It Works</a><a href="#grading">Grade Logic</a><a href="#audiences">Who It Helps</a><a href="#compare">Compare</a><a href="#about">About</a><a class="nav-cta" href="#access">Private Beta</a>',
                  '<a href="#advisor">Your Advisor</a><a href="#proof">Try It</a><a href="#workflow">How It Works</a><a href="#grading">Grade Logic</a><a href="#audiences">Who It Helps</a><a href="#compare">Compare</a><a class="nav-cta" href="#access">Private Beta</a>'
              ),
              (
                  '<nav class="mobile-nav" id="mobile-navigation" aria-label="Mobile navigation"><a href="#proof">Try It</a><a href="#workflow">How It Works</a><a href="#grading">Grade Logic</a><a href="#audiences">Who It Helps</a><a href="#compare">Compare</a><a href="#about">About Us</a><a href="#access">Private Beta</a></nav>',
                  '<nav class="mobile-nav" id="mobile-navigation" aria-label="Mobile navigation"><a href="#advisor">Your Advisor</a><a href="#proof">Try It</a><a href="#workflow">How It Works</a><a href="#grading">Grade Logic</a><a href="#audiences">Who It Helps</a><a href="#compare">Compare</a><a href="#about">About Us</a><a href="#access">Private Beta</a></nav>'
              ),
              (
                  '<h1 id="hero-title">Know whether the card, the evidence, and the deal make sense<span>.</span></h1>',
                  '<h1 id="hero-title">Your sports card purchase advisor—beside you before you buy<span>.</span></h1>'
              ),
              (
                  '<p class="lead">FlipForge connects exact-card identity, completed-sale evidence, asking-price context, grading economics, liquidity, confidence, and risk into one explainable decision.</p>',
                  '<p class="lead">FlipForge guides you through the questions an experienced card advisor would ask: Is this the exact card? Is the evidence trustworthy? Is the price supported? Is grading worth it? What should happen next?</p>'
              ),
              (
                  '<div class="hero-promise"><strong>Not another price lookup.</strong> FlipForge is the decision layer between scattered market data and your money.</div>',
                  '<div class="hero-promise"><strong>Not another price lookup.</strong> It is like having a disciplined second set of eyes beside you—checking the card, challenging the evidence, testing the economics, and explaining the next move before you spend.</div>'
              ),
              (
                  '<div class="buttons"><a class="btn primary" href="#proof">Try the Decision Logic</a><a class="btn" href="#workflow">See How It Works</a><a class="btn" href="#access">Request Beta Access</a></div>',
                  '<div class="buttons"><a class="btn primary" href="#advisor">Meet Your Purchase Advisor</a><a class="btn" href="#proof">Try the Guidance</a><a class="btn" href="#access">Request Beta Access</a></div>'
              ),
              (
                  '<div class="trust-item"><strong>Identity First</strong><span>The exact card is confirmed before evidence affects value.</span></div>',
                  '<div class="trust-item"><strong>Guidance at Every Step</strong><span>FlipForge walks through the purchase instead of leaving you to interpret raw data alone.</span></div>'
              ),
              (
                  '<div><div class="kicker">Interactive Proof</div><h2>What happens when the asking price changes?</h2></div>',
                  '<div><div class="kicker">Advisor in Action</div><h2>See how the guidance changes when the deal changes.</h2></div>'
              ),
              (
                  '<p class="section-copy">Adjust the example below. The decision changes because the total acquisition cost, supported value, evidence confidence, and margin change—not because FlipForge is forcing a permanent answer.</p>',
                  '<p class="section-copy">Adjust the example below. Like a good advisor, FlipForge changes its guidance when the price, total cost, evidence confidence, or supported margin changes—and explains why.</p>'
              ),
              (
                  '<div class="result-top"><div><h3>FlipForge Decision</h3><div class="decision buy" id="deal-decision">BUY</div></div><div class="confidence-chip" id="deal-confidence-chip">Medium confidence</div></div>',
                  '<div class="result-top"><div><h3>Advisor Guidance</h3><div class="decision buy" id="deal-decision">BUY</div></div><div class="confidence-chip" id="deal-confidence-chip">Medium confidence</div></div>'
              ),
              (
                  '<p class="section-copy intro">The product is built around the major questions people ask before they buy, sell, hold, or grade a card.</p>',
                  '<p class="section-copy intro">The product acts as a consistent second set of eyes for the major questions people ask before they buy, sell, hold, or grade a card.</p>'
              ),
              (
                  '<div class="compare-callout"><div><strong>More data is not the advantage. Better decision logic is.</strong><span>FlipForge turns disconnected evidence into an outcome that can be inspected, challenged, and improved.</span></div><a class="btn primary" href="#access">Join the Private Beta</a></div>',
                  '<div class="compare-callout"><div><strong>More data is not the advantage. Guidance at the moment of purchase is.</strong><span>FlipForge turns disconnected evidence into an advisor-style recommendation that can be inspected, challenged, and improved.</span></div><a class="btn primary" href="#access">Join the Private Beta</a></div>'
              ),
              (
                  '<p class="section-copy intro">FlipForge LLC is building a sports-card decision-intelligence platform for collectors who need the logic behind a decision—not just another number.</p>',
                  '<p class="section-copy intro">FlipForge LLC is building a guided sports-card decision-intelligence platform for collectors who want an advisor beside them—not another number they must interpret alone.</p>'
              ),
              (
                  '<p class="section-copy">Early users will test search, discovery, identity controls, evidence review, grading logic, recommendation clarity, confidence, risk language, accessibility, and decision quality.</p>',
                  '<p class="section-copy">Early users will test whether FlipForge feels like a trusted purchase advisor: guiding search, identity checks, evidence review, grading logic, recommendation clarity, confidence, risk, and the next action.</p>'
              )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Required homepage text not found: {old[:90]}")
              text = text.replace(old, new, 1)

          css_anchor = '    .demo-shell{display:grid;grid-template-columns:.85fr 1.15fr;gap:20px;margin-top:30px}'
          advisor_css = '''    .advisor-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;margin-top:30px}
    .advisor-panel,.advisor-dialogue{padding:28px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(13,25,42,.96),rgba(5,11,20,.98));box-shadow:0 20px 70px rgba(0,0,0,.27)}
    .advisor-panel h3,.advisor-dialogue h3{color:var(--gold2)}
    .advisor-panel>p{margin-top:10px;color:var(--copy);font-size:15px}
    .advisor-steps{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:21px}
    .advisor-step{padding:17px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025)}
    .advisor-step b{display:grid;place-items:center;width:28px;height:28px;margin-bottom:10px;border:1px solid rgba(212,175,55,.45);color:var(--gold2);font-size:10px}
    .advisor-step strong{display:block;color:var(--text);font-size:12px}
    .advisor-step span{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.55}
    .advisor-dialogue{border-color:rgba(212,175,55,.4);background:linear-gradient(180deg,rgba(212,175,55,.11),rgba(5,11,20,.98))}
    .advisor-message{margin-top:17px;padding:16px 17px;border:1px solid var(--line);border-radius:14px;background:rgba(3,8,18,.58)}
    .advisor-message small{display:block;color:var(--gold);font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
    .advisor-message p{margin-top:6px;color:var(--copy);font-size:14px;line-height:1.65}
    .advisor-message.guidance{border-color:rgba(79,210,139,.43)}
    .advisor-message.guidance strong{color:var(--green);font-size:22px;letter-spacing:.06em}
    .advisor-boundary{margin-top:16px;color:var(--muted);font-size:11px;line-height:1.6}'''
          if css_anchor not in text:
              raise SystemExit("Advisor CSS anchor not found")
          text = text.replace(css_anchor, advisor_css + "\n" + css_anchor, 1)

          responsive_anchor = '    @media(max-width:900px){.desktop-nav{display:none}.menu-toggle{display:block}.about-grid,.access,.compare-callout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}'
          responsive_new = '    @media(max-width:900px){.desktop-nav{display:none}.menu-toggle{display:block}.about-grid,.access,.compare-callout,.advisor-layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}'
          if responsive_anchor not in text:
              raise SystemExit("Advisor responsive anchor not found")
          text = text.replace(responsive_anchor, responsive_new, 1)

          mobile_anchor = '    @media(max-width:650px){section{padding:54px 20px}.hero{padding-top:50px}.wordmark{font-size:15px;letter-spacing:.21em}.tagline{font-size:6px}h1{font-size:clamp(39px,12vw,55px)}h2{font-size:31px}.lead,.section-copy{font-size:16px}.buttons{display:grid}.btn{width:100%}.trust-strip,.summary-grid,.three,.grid,.values,.question-grid,.metric-grid,.form-grid,.prob-grid{grid-template-columns:1fr}.trust-strip{margin-top:0}.visual{border-radius:10px}.story,.founder-card,.legal,.panel,.access,.control-card,.result-card{padding:22px}.field.full{grid-column:auto}.result-top{align-items:flex-start;flex-direction:column}}'
          mobile_new = '    @media(max-width:650px){section{padding:54px 20px}.hero{padding-top:50px}.wordmark{font-size:15px;letter-spacing:.21em}.tagline{font-size:6px}h1{font-size:clamp(39px,12vw,55px)}h2{font-size:31px}.lead,.section-copy{font-size:16px}.buttons{display:grid}.btn{width:100%}.trust-strip,.summary-grid,.three,.grid,.values,.question-grid,.metric-grid,.form-grid,.prob-grid,.advisor-steps{grid-template-columns:1fr}.trust-strip{margin-top:0}.visual{border-radius:10px}.story,.founder-card,.legal,.panel,.access,.control-card,.result-card,.advisor-panel,.advisor-dialogue{padding:22px}.field.full{grid-column:auto}.result-top{align-items:flex-start;flex-direction:column}}'
          if mobile_anchor not in text:
              raise SystemExit("Advisor mobile anchor not found")
          text = text.replace(mobile_anchor, mobile_new, 1)

          advisor_section = '''  <section id="advisor">
    <div class="section-head">
      <div><div class="kicker">Your Purchase Advisor</div><h2>You should not have to interpret the card market alone.</h2></div>
      <p class="section-copy">FlipForge follows the purchase beside you. It asks the questions that are easy to skip when a card looks exciting, then turns the answers into clear guidance and an explanation.</p>
    </div>
    <div class="advisor-layout">
      <article class="advisor-panel">
        <h3>How the advisor guides you</h3>
        <p>Instead of handing you a price and disappearing, FlipForge moves through the decision in a controlled order.</p>
        <div class="advisor-steps">
          <div class="advisor-step"><b>01</b><strong>Understand the purchase</strong><span>What card is it, what is the asking price, and what decision are you trying to make?</span></div>
          <div class="advisor-step"><b>02</b><strong>Check the exact card</strong><span>Confirm the year, set, card number, parallel, variation, grader, and grade.</span></div>
          <div class="advisor-step"><b>03</b><strong>Challenge the evidence</strong><span>Separate real completed sales from asking prices, mismatches, stale records, and weak comparisons.</span></div>
          <div class="advisor-step"><b>04</b><strong>Guide the next move</strong><span>Explain whether to BUY, WATCH, VERIFY, PASS, or GRADE—and what could change that answer.</span></div>
        </div>
      </article>
      <aside class="advisor-dialogue">
        <h3>What that feels like</h3>
        <div class="advisor-message"><small>You ask</small><p>“This card is listed for $190. Is it actually a good purchase?”</p></div>
        <div class="advisor-message"><small>FlipForge checks</small><p>Exact identity, all-in cost, completed-sale support, asking-price context, liquidity, confidence, grading upside, and the risks that could invalidate the deal.</p></div>
        <div class="advisor-message guidance"><small>Advisor guidance</small><p><strong>BUY</strong></p><p>The all-in cost is meaningfully below supported evidence. Confirm condition and seller details before acting.</p></div>
        <p class="advisor-boundary">FlipForge is software-based decision support—not a human financial advisor, transaction authorization, or guarantee of profit.</p>
      </aside>
    </div>
  </section>'''

          section_anchor = '  <section id="proof">'
          if section_anchor not in text:
              raise SystemExit("Advisor section anchor not found")
          text = text.replace(section_anchor, advisor_section + "\n\n" + section_anchor, 1)

          table_anchor = '            <tr><td>Retains decision traceback and outcome context</td><td class="no">No</td><td class="no">No</td><td class="yes flipforge-col">Yes</td></tr>'
          table_new = '            <tr><td>Guides the purchase decision step by step</td><td class="no">No</td><td class="no">No</td><td class="yes flipforge-col">Yes</td></tr>\n' + table_anchor
          if table_anchor not in text:
              raise SystemExit("Advisor comparison row anchor not found")
          text = text.replace(table_anchor, table_new, 1)

          path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/one-time-advisor-positioning.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Commit completed advisor positioning
        run: |
          git config user.name "FlipForge Website Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/one-time-advisor-positioning.yml
          git commit -m "Position FlipForge as the collector purchase advisor"
          git push
