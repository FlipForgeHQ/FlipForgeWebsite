name: Add mobile navigation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - trigger-mobile-navigation.txt

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add accessible hamburger navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          if 'class="menu-toggle"' not in html:
              css = r'''
    .menu-toggle{display:none;width:44px;height:44px;padding:0;border:1px solid var(--line-strong);border-radius:12px;background:rgba(255,255,255,.035);color:var(--text);cursor:pointer;align-items:center;justify-content:center;position:relative;z-index:32;transition:border-color .2s ease,background .2s ease}.menu-toggle:hover{border-color:var(--gold-line);background:var(--gold-soft)}.menu-toggle span,.menu-toggle:before,.menu-toggle:after{content:"";display:block;position:absolute;width:20px;height:2px;border-radius:999px;background:currentColor;transition:transform .25s ease,opacity .2s ease}.menu-toggle:before{transform:translateY(-6px)}.menu-toggle:after{transform:translateY(6px)}.menu-toggle[aria-expanded="true"] span{opacity:0}.menu-toggle[aria-expanded="true"]:before{transform:rotate(45deg)}.menu-toggle[aria-expanded="true"]:after{transform:rotate(-45deg)}.menu-backdrop{display:none;position:fixed;inset:0;z-index:24;background:rgba(0,0,0,.58);backdrop-filter:blur(2px)}body.menu-open{overflow:hidden}
    @media(max-width:960px){.nav{position:relative}.menu-toggle{display:inline-flex}nav.primary-nav{display:flex;position:fixed;top:0;right:0;z-index:30;width:min(84vw,360px);height:100dvh;padding:92px 24px 28px;flex-direction:column;align-items:stretch;gap:0;flex-wrap:nowrap;background:linear-gradient(180deg,#07101d 0%,#01040a 100%);border-left:1px solid var(--gold-line);box-shadow:-28px 0 80px rgba(0,0,0,.58);transform:translateX(105%);visibility:hidden;transition:transform .28s ease,visibility .28s ease}nav.primary-nav.is-open{transform:translateX(0);visibility:visible}nav.primary-nav a{display:flex;align-items:center;min-height:54px;padding:0 8px;border-bottom:1px solid var(--line);color:var(--body-copy);font-size:12px}nav.primary-nav a:hover,nav.primary-nav a:focus-visible{color:var(--gold)}.menu-backdrop.is-open{display:block}}
    @media(prefers-reduced-motion:reduce){.menu-toggle span,.menu-toggle:before,.menu-toggle:after,nav.primary-nav{transition:none}}
'''
              html = html.replace('  </style>', css + '  </style>', 1)

              header = '''  <header><div class="nav"><a class="brand-lockup" href="#top" aria-label="FlipForge home"><svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="1" y="1" width="62" height="62" fill="none" stroke="rgba(212,175,55,0.34)"/><path d="M14 14H30V23H23V30H14V14Z" fill="#f2f2f2"/><path d="M34 14H50V30H41V23H34V14Z" fill="#f2f2f2"/><path d="M14 34H23V41H30V50H14V34Z" fill="#f2f2f2"/><path d="M41 34H50V50H34V41H41V34Z" fill="#f2f2f2"/><rect x="28" y="28" width="8" height="8" fill="#d4af37"/></svg><span class="brand-word">FLIPFORGE<span class="tm">™</span></span></a><nav class="primary-nav" id="primary-navigation" aria-label="Primary navigation"><a href="#meaning">Meaning</a><a href="#platform">Platform</a><a href="#about">About</a><a href="#workflow">Workflow</a><a href="#data">Data Use</a><a href="#compliance">Compliance</a><a href="#access">Request Access</a></nav><button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-navigation"><span></span></button></div></header><div class="menu-backdrop" aria-hidden="true"></div>'''
              html, count = re.subn(r'  <header>.*?</header>', header, html, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError('Could not locate the site header')

              script = r'''
  <script>
    (()=>{const button=document.querySelector('.menu-toggle');const menu=document.querySelector('.primary-nav');const backdrop=document.querySelector('.menu-backdrop');if(!button||!menu||!backdrop)return;const setOpen=open=>{button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'Close navigation menu':'Open navigation menu');menu.classList.toggle('is-open',open);backdrop.classList.toggle('is-open',open);document.body.classList.toggle('menu-open',open);backdrop.setAttribute('aria-hidden',String(!open));};button.addEventListener('click',()=>setOpen(button.getAttribute('aria-expanded')!=='true'));backdrop.addEventListener('click',()=>setOpen(false));menu.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>setOpen(false)));document.addEventListener('keydown',event=>{if(event.key==='Escape')setOpen(false)});window.addEventListener('resize',()=>{if(window.innerWidth>960)setOpen(false)});})();
  </script>
'''
              html = html.replace('</body>', script + '</body>', 1)
              path.write_text(html, encoding='utf-8')

      - name: Commit navigation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add responsive hamburger navigation" || exit 0
          git push origin HEAD:main
