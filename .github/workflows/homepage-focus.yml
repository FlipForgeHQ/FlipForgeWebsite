name: Homepage Focus

on:
  pull_request:
    paths:
      - "index.html"
      - "decision-proof.html"
      - "product.html"
      - "sample-decision-dossier.html"
      - "netlify.toml"
      - "assets/js/homepage-v1.js"
      - "assets/js/marketing-v3.js"
      - "assets/js/site.js"
      - "assets/css/homepage-focus-v1.css"
      - "assets/css/ff-decision-visual-v1.css"
      - "assets/css/homepage-hero-v6.css"
      - "assets/css/homepage-sections-v1.css"
      - "assets/images/ff-fictional-slab-v1.svg"
      - "assets/css/decision-proof-v1.css"
      - "assets/css/sample-dossier-v1.css"
      - "assets/css/visual-sections.css"
      - "scripts/validate-homepage-focus.mjs"
      - "scripts/validate-homepage-hero-v6.mjs"
      - "scripts/validate-homepage-progression.mjs"
      - "scripts/validate-decision-proof-public-v1.mjs"
      - "scripts/validate-product-identity-simulator.mjs"
      - "assets/css/homepage-audiences-v1.css"
      - "assets/js/homepage-audiences-v1.js"
      - "marketing/content/audience-messaging.json"
      - "scripts/build-homepage-audiences.mjs"
      - "scripts/validate-homepage-audiences-v1.mjs"
      - "assets/css/homepage-challenge-v1.css"
      - "assets/js/homepage-challenge-v1.js"
      - "assets/js/homepage-v10.js"
      - "assets/js/conversion-events.js"
      - "assets/js/beta-application.js"
      - "netlify/modern-functions/conversion-event.mjs"
      - "scripts/validate-homepage-challenge-v1.mjs"
      - "assets/css/homepage-app-showcase-v1.css"
      - "assets/js/homepage-app-showcase-v1.js"
      - "assets/images/ff-app-*.webp"
      - "scripts/validate-homepage-app-showcase-v1.mjs"
      - "scripts/validate-conversion-event-contract.mjs"
      - ".github/workflows/homepage-focus.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "decision-proof.html"
      - "product.html"
      - "sample-decision-dossier.html"
      - "netlify.toml"
      - "assets/js/homepage-v1.js"
      - "assets/js/marketing-v3.js"
      - "assets/js/site.js"
      - "assets/css/homepage-focus-v1.css"
      - "assets/css/ff-decision-visual-v1.css"
      - "assets/css/homepage-hero-v6.css"
      - "assets/css/homepage-sections-v1.css"
      - "assets/images/ff-fictional-slab-v1.svg"
      - "assets/css/decision-proof-v1.css"
      - "assets/css/sample-dossier-v1.css"
      - "assets/css/visual-sections.css"
      - "scripts/validate-homepage-focus.mjs"
      - "scripts/validate-homepage-hero-v6.mjs"
      - "scripts/validate-homepage-progression.mjs"
      - "scripts/validate-decision-proof-public-v1.mjs"
      - "scripts/validate-product-identity-simulator.mjs"
      - "assets/css/homepage-audiences-v1.css"
      - "assets/js/homepage-audiences-v1.js"
      - "marketing/content/audience-messaging.json"
      - "scripts/build-homepage-audiences.mjs"
      - "scripts/validate-homepage-audiences-v1.mjs"
      - "assets/css/homepage-challenge-v1.css"
      - "assets/js/homepage-challenge-v1.js"
      - "assets/js/homepage-v10.js"
      - "assets/js/conversion-events.js"
      - "assets/js/beta-application.js"
      - "netlify/modern-functions/conversion-event.mjs"
      - "scripts/validate-homepage-challenge-v1.mjs"
      - "assets/css/homepage-app-showcase-v1.css"
      - "assets/js/homepage-app-showcase-v1.js"
      - "assets/images/ff-app-*.webp"
      - "scripts/validate-homepage-app-showcase-v1.mjs"
      - "scripts/validate-conversion-event-contract.mjs"
      - ".github/workflows/homepage-focus.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate focused homepage structure
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse marketing browser JavaScript
        run: |
          node --check assets/js/marketing-v3.js
          node --check assets/js/homepage-v1.js
          node --check assets/js/site.js
          node --check assets/js/homepage-audiences-v1.js
          node --check assets/js/homepage-challenge-v1.js
          node --check assets/js/homepage-app-showcase-v1.js
          node --check assets/js/beta-application.js
      - name: Validate focused marketing contract
        run: |
          node scripts/validate-homepage-focus.mjs
          node scripts/validate-homepage-hero-v6.mjs
          node scripts/validate-homepage-progression.mjs
          node scripts/validate-decision-proof-public-v1.mjs
          node scripts/validate-product-identity-simulator.mjs
          node scripts/build-homepage-audiences.mjs --check
          node scripts/validate-homepage-audiences-v1.mjs
          node scripts/validate-homepage-challenge-v1.mjs
          node scripts/validate-homepage-app-showcase-v1.mjs
          node scripts/validate-conversion-event-contract.mjs
