name: SaaS Production Account

on:
  pull_request:
    paths:
      - "saas-prototype/index.html"
      - "saas-prototype/customer-account.js"
      - "saas-prototype/customer-account-bridge.js"
      - "saas-prototype/customer-entitlements.js"
      - "saas-prototype/production-customer-entitlements.js"
      - "saas-prototype/staging-route-hook.js"
      - "netlify/functions/flipforge-api.js"
      - "docs/SAAS_CORE_PLATFORM_COMPLETION_PLAN.md"
      - "scripts/validate-saas-production-account.mjs"
      - "scripts/validate-production-entitlements-compat.mjs"
      - ".github/workflows/saas-production-account.yml"
  push:
    branches:
      - main
    paths:
      - "saas-prototype/index.html"
      - "saas-prototype/customer-account.js"
      - "saas-prototype/customer-account-bridge.js"
      - "saas-prototype/customer-entitlements.js"
      - "saas-prototype/production-customer-entitlements.js"
      - "saas-prototype/staging-route-hook.js"
      - "netlify/functions/flipforge-api.js"
      - "docs/SAAS_CORE_PLATFORM_COMPLETION_PLAN.md"
      - "scripts/validate-saas-production-account.mjs"
      - "scripts/validate-production-entitlements-compat.mjs"
      - ".github/workflows/saas-production-account.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate read-only production account
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Parse production account browser JavaScript
        run: |
          node --check saas-prototype/customer-account.js
          node --check saas-prototype/customer-account-bridge.js
          node --check saas-prototype/production-customer-entitlements.js
      - name: Validate production account boundary
        run: node scripts/validate-saas-production-account.mjs
      - name: Validate frozen entitlement compatibility
        run: node scripts/validate-production-entitlements-compat.mjs
      - name: Retain preview entitlements validation
        run: node scripts/validate-saas-customer-entitlements.mjs
