name: SaaS Beta Complete Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate core SaaS Beta Complete static gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install website dependencies
        run: npm install --no-audit --no-fund

      - name: Build Identity client
        run: npm run build:identity

      - name: Validate Beta Complete static contract
        run: node scripts/validate-saas-beta-complete-gate.mjs

      - name: Validate destructive customer-state audit is wired
        run: node scripts/validate-prebeta-customer-state-audit.mjs

      - name: Validate destructive saved-decision lifecycle audit is wired
        run: node scripts/validate-prebeta-saved-decision-lifecycle-audit.mjs

      - name: Validate destructive cross-surface audit is wired
        run: node scripts/validate-prebeta-cross-surface-audit.mjs

      - name: Validate live production parity gate is wired
        run: node scripts/validate-live-production-parity-gate.mjs

      - name: Validate backend runtime identity gateway
        run: node scripts/validate-backend-runtime-identity-gateway.mjs

      - name: Validate production customer loop
        run: node scripts/validate-saas-core-production-loop.mjs

      - name: Validate explainability and production account
        run: |
          node scripts/validate-saas-customer-explainability.mjs
          node scripts/validate-saas-production-account.mjs

      - name: Validate authentication and account lifecycle
        run: |
          npm run validate:identity
          npm run validate:account-lifecycle

      - name: Validate primary customer intelligence routes
        run: |
          npm run validate:customer-discovery
          npm run validate:cardsight-evidence-visibility
          npm run validate:price-intelligence
          npm run validate:customer-intelligence
          npm run validate:customer-dashboard
          npm run validate:commercial-dashboard-live-qa
          npm run validate:customer-compare
          npm run validate:customer-management

      - name: Validate lifecycle portfolio and audit routes
        run: |
          npm run validate:customer-portfolio
          npm run validate:customer-lifecycle
          npm run validate:customer-export
          npm run validate:customer-entitlements

      - name: Validate quota and private-beta operations boundaries
        run: |
          npm run validate:evaluation-quota-boundary
          npm run validate:private-beta-operations-boundary

      - name: Confirm live proof remains required
        run: |
          grep -q "LIVE PROOF REQUIRED" docs/SAAS_BETA_COMPLETE_LIVE_QA.md
          grep -q "green static/CI gate is a prerequisite" docs/SAAS_BETA_COMPLETE_LIVE_QA.md
          grep -q "Beta Complete requires one controlled" docs/SAAS_BETA_COMPLETE_LIVE_QA.md
