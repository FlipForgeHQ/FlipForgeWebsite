name: Hosted Runner Matrix Probe

on:
  push:
    branches:
      - feat/cross-app-customer-parity-gate

permissions:
  contents: read

jobs:
  ubuntu2204:
    name: ubuntu-22.04 probe
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - run: echo "ubuntu-22.04=PASS"

  windows:
    name: windows-latest probe
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - shell: pwsh
        run: Write-Output "windows-latest=PASS"

  macos:
    name: macos-14 probe
    runs-on: macos-14
    timeout-minutes: 2
    steps:
      - run: echo "macos-14=PASS"
