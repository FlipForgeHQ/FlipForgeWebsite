name: Refresh Audited Dependency

on:
  push:
    branches:
      - security/independent-audit-section1-20260901

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/independent-audit-section1-20260901
          fetch-depth: 0

      - name: Update vulnerable dependency and lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact @netlify/blobs@10.7.13
          npm audit --package-lock-only --audit-level=high
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update audited Netlify blobs dependency"
          git push origin HEAD:security/independent-audit-section1-20260901
