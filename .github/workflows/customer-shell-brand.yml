name: Customer Shell Brand Assurance

on:
  pull_request:
    paths:
      - "saas-prototype/**"
      - "scripts/audit-customer-shell-brand-ci.mjs"
      - "scripts/audit-result-guide-verdict-ci.mjs"
      - "scripts/audit-saved-verdict-loading-ci.mjs"
      - "scripts/audit-card-switch-stale-response-ci.mjs"
      - "scripts/audit-discover-evaluate-outcomes-ci.mjs"
      - "scripts/audit-evaluate-page-allowance-ci.mjs"
      - "scripts/audit-guided-mode-clearance-ci.mjs"
      - "scripts/audit-guided-mode-evaluation-target-ci.mjs"
      - "scripts/audit-customer-shell-settles-ci.mjs"
      - "scripts/validate-decision-dashboard-v3.mjs"
      - "scripts/build-identity-client.mjs"
      - "package.json"
      - ".github/workflows/customer-shell-brand.yml"
      - "scripts/ci/install-playwright-chromium.sh"
  push:
    branches:
      - main
    paths:
      - "saas-prototype/**"
      - "scripts/audit-customer-shell-brand-ci.mjs"
      - "scripts/audit-result-guide-verdict-ci.mjs"
      - "scripts/audit-saved-verdict-loading-ci.mjs"
      - "scripts/audit-card-switch-stale-response-ci.mjs"
      - "scripts/audit-discover-evaluate-outcomes-ci.mjs"
      - "scripts/audit-evaluate-page-allowance-ci.mjs"
      - "scripts/audit-guided-mode-clearance-ci.mjs"
      - "scripts/audit-guided-mode-evaluation-target-ci.mjs"
      - "scripts/audit-customer-shell-settles-ci.mjs"
      - "scripts/validate-decision-dashboard-v3.mjs"
      - "scripts/build-identity-client.mjs"
      - "package.json"
      - ".github/workflows/customer-shell-brand.yml"
      - "scripts/ci/install-playwright-chromium.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-shell-brand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-shell-brand:
    # The same audits as before, split into four groups that run in parallel (about 24 minutes in one job before,
    # about 7 per group). Each group starts its own server; no audit was removed. Group times are from the
    # 2026-10-31 run.
    name: Customer shell brand alignment (V2 default + V3 flagged) · ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: g1
            label: brand, discover (beta), card switch (beta)
          - group: g2
            label: discover (app), card switch (app), allowance (app)
          - group: g3
            label: guided mode, allowance (beta), settles (beta)
          - group: g4
            label: saved verdict while loading, settles (app)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install website dependencies
        run: npm install --no-audit --no-fund

      - name: Build production Identity assets
        run: npm run build:identity

      - name: Install Playwright Chromium
        run: bash scripts/ci/install-playwright-chromium.sh

      - name: Start production-path app server
        run: |
          node saas-prototype/serve.mjs > /tmp/flipforge-customer-shell-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/flipforge-customer-shell-server.log
          exit 1

      - name: Customer shell brand Playwright audit
        if: matrix.group == 'g1'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app
          FLIPFORGE_SHELL_SCREENSHOT_DIR: artifacts/customer-shell
        run: node scripts/audit-customer-shell-brand-ci.mjs

      - name: Result guide explains the saved verdict only
        if: matrix.group == 'g1'
        run: node scripts/audit-result-guide-verdict-ci.mjs

      # Full app shell, every script: no surface may name a verdict other than the saved one, including during
      # 10.5 s loads, failed requests and card switches (2026-10-13 BUY-on-WATCH regression).
      - name: Saved verdict while loading - Private Beta path (/app/beta)
        if: matrix.group == 'g4'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app/beta
        run: node scripts/audit-saved-verdict-loading-ci.mjs

      - name: Saved verdict while loading - customer app path (/app)
        if: matrix.group == 'g4'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app
        run: node scripts/audit-saved-verdict-loading-ci.mjs

      # Route safety: no previously saved card may appear beneath a new card URL.
      - name: Card switching never shows another card - Private Beta path (/app/beta)
        if: matrix.group == 'g1'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app/beta
        run: node scripts/audit-card-switch-stale-response-ci.mjs

      - name: Card switching never shows another card - customer app path (/app)
        if: matrix.group == 'g2'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app
        run: node scripts/audit-card-switch-stale-response-ci.mjs

      # Shell stability: after load, every screen must stop changing (2026-10-18 mobile flicker: shell scripts
      # re-wrote watched nav attributes every frame, ~3,700-6,200 DOM changes per second).
      - name: Customer shell settles after load - Private Beta path (/app/beta)
        if: matrix.group == 'g3'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app/beta
        run: node scripts/audit-customer-shell-settles-ci.mjs

      - name: Customer shell settles after load - customer app path (/app)
        if: matrix.group == 'g4'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app
        run: node scripts/audit-customer-shell-settles-ci.mjs

      # Discover -> Evaluate: every server outcome reaches the saved decision or shows a visible, actionable error
      # beside the button, with no reload or route change (2026-10-14 evaluation-limit incident).
      - name: Discover evaluate outcomes - Private Beta path (/app/beta)
        if: matrix.group == 'g1'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app/beta
        run: node scripts/audit-discover-evaluate-outcomes-ci.mjs

      - name: Discover evaluate outcomes - customer app path (/app)
        if: matrix.group == 'g2'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app
        run: node scripts/audit-discover-evaluate-outcomes-ci.mjs

      - name: Evaluate page allowance message - Private Beta path (/app/beta)
        if: matrix.group == 'g3'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app/beta
        run: node scripts/audit-evaluate-page-allowance-ci.mjs

      - name: Evaluate page allowance message - customer app path (/app; late-answer races reload the page here, checked on /app/beta)
        if: matrix.group == 'g2'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app
        run: node scripts/audit-evaluate-page-allowance-ci.mjs

      - name: Guided Mode never covers primary controls - Private Beta path (/app/beta)
        if: matrix.group == 'g3'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app/beta
        run: node scripts/audit-guided-mode-clearance-ci.mjs

      - name: Guided Mode never covers primary controls - real full customer shell (/app/customer)
        if: matrix.group == 'g3'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app/customer
        run: node scripts/audit-guided-mode-clearance-ci.mjs

      - name: Guided Mode on Evaluate highlights the manual form's first field, never a hidden Bulk CSV control (/app/beta)
        if: matrix.group == 'g1'
        env:
          FLIPFORGE_LAYOUT_AUDIT_URL: http://127.0.0.1:4173/app/beta
        run: node scripts/audit-guided-mode-evaluation-target-ci.mjs

      - name: Upload owner-review screenshots
        if: always() && matrix.group == 'g1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: customer-shell-brand-screenshots
          path: artifacts/customer-shell
          if-no-files-found: warn
          retention-days: 14
