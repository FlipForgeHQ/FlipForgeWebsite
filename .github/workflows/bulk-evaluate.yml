name: Bulk Evaluate

on:
  pull_request:
    paths:
      - "netlify/modern-functions/bulk-evaluate.js"
      - "scripts/validate-saas-bulk-evaluate-endpoint.mjs"
      - "scripts/validate-phase7-replay-safe-day0-ids.mjs"
      - ".github/workflows/bulk-evaluate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check netlify/modern-functions/bulk-evaluate.js
      - name: Validate Bulk Evaluate boundary
        run: node scripts/validate-saas-bulk-evaluate-endpoint.mjs
      - name: Validate replay-safe Phase 7 Day-0 IDs
        run: node scripts/validate-phase7-replay-safe-day0-ids.mjs
