name: Phase 6 Consumer UX Refinement

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'saas-prototype/index.html'
      - 'saas-prototype/consumer-ux-refinement.js'
      - 'saas-prototype/consumer-ux-refinement.css'
      - 'saas-prototype/customer-professional-polish.js'
      - 'scripts/validate-consumer-ux-refinement.mjs'
      - '.github/workflows/phase6-consumer-ux-refinement.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate customer-safe Phase 6 UX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check saas-prototype/consumer-ux-refinement.js
          node --check saas-prototype/customer-professional-polish.js
          node --check scripts/validate-consumer-ux-refinement.mjs
      - name: Validate Phase 6 customer UX contract
        run: node scripts/validate-consumer-ux-refinement.mjs
      - name: Retain consumer navigation contract
        run: node scripts/validate-consumer-pro-navigation.mjs
      - name: Retain CardSight customer identity contract
        run: node scripts/validate-cardsight-customer-intelligence.mjs
      - name: Retain customer intelligence authority boundary
        run: npm run validate:customer-intelligence
