name: Sitewide UX Assurance

on:
  pull_request:
    paths:
      - "index.html"
      - "product.html"
      - "decision-intelligence.html"
      - "connect/index.html"
      - "learn.html"
      - "pricing.html"
      - "about.html"
      - "beta-application.html"
      - "faq.html"
      - "data-use.html"
      - "privacy.html"
      - "terms.html"
      - "beta-terms.html"
      - "refund.html"
      - "thank-you.html"
      - "beta-onboarding.html"
      - "404.html"
      - "package.json"
      - "assets/css/**"
      - "assets/js/award-winning-v1.js"
      - "assets/js/conversion-events.js"
      - "saas-prototype/index.html"
      - "saas-prototype/customer-readability.css"
      - "saas-prototype/customer-layout-system-v2.css"
      - "saas-prototype/guided-mode-compact-v1.css"
      - "scripts/validate-sitewide-ux.mjs"
      - "scripts/validate-decision-intelligence-public-page.mjs"
      - "scripts/audit-public-typography-rendered.mjs"
      - ".github/workflows/sitewide-ux.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "product.html"
      - "decision-intelligence.html"
      - "connect/index.html"
      - "learn.html"
      - "pricing.html"
      - "about.html"
      - "beta-application.html"
      - "faq.html"
      - "data-use.html"
      - "privacy.html"
      - "terms.html"
      - "beta-terms.html"
      - "refund.html"
      - "thank-you.html"
      - "beta-onboarding.html"
      - "404.html"
      - "package.json"
      - "assets/css/**"
      - "assets/js/award-winning-v1.js"
      - "assets/js/conversion-events.js"
      - "saas-prototype/index.html"
      - "saas-prototype/customer-readability.css"
      - "saas-prototype/customer-layout-system-v2.css"
      - "saas-prototype/guided-mode-compact-v1.css"
      - "scripts/validate-sitewide-ux.mjs"
      - "scripts/validate-decision-intelligence-public-page.mjs"
      - "scripts/audit-public-typography-rendered.mjs"
      - ".github/workflows/sitewide-ux.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate sitewide viewport, typography, and density ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse changed browser JavaScript
        run: |
          node --check assets/js/award-winning-v1.js
          node --check assets/js/conversion-events.js
      - name: Validate Decision Intelligence public contract
        run: node scripts/validate-decision-intelligence-public-page.mjs
      - name: Validate static sitewide UX contracts
        run: npm run validate:sitewide-ux
      - name: Install Chromium for rendered typography audit
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local public site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/flipforge-sitewide-ux.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/flipforge-sitewide-ux.log
          exit 1
      - name: Validate rendered typography across public pages
        run: node scripts/audit-public-typography-rendered.mjs
