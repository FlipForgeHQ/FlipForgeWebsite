name: SaaS Lifecycle Validation UX

on:
  pull_request:
    paths:
      - "saas-prototype/customer-lifecycle.js"
      - "saas-prototype/customer-lifecycle-validation.js"
      - "saas-prototype/customer-lifecycle-validation.css"
      - "saas-prototype/customer-lifecycle-display.js"
      - "saas-prototype/index.html"
      - "scripts/validate-lifecycle-validation-ux.mjs"
      - ".github/workflows/saas-lifecycle-validation-ux.yml"
  push:
    branches: [main]
    paths:
      - "saas-prototype/customer-lifecycle.js"
      - "saas-prototype/customer-lifecycle-validation.js"
      - "saas-prototype/customer-lifecycle-validation.css"
      - "saas-prototype/customer-lifecycle-display.js"
      - "saas-prototype/index.html"
      - "scripts/validate-lifecycle-validation-ux.mjs"
      - ".github/workflows/saas-lifecycle-validation-ux.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-lifecycle-guidance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Validate lifecycle guidance rules
        run: node scripts/validate-lifecycle-validation-ux.mjs
