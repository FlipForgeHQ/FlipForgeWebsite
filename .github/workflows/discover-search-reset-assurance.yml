name: Discover Search Reset Assurance

on:
  pull_request:
    paths:
      - 'saas-prototype/customer-discovery.js'
      - 'scripts/validate-discover-search-reset.mjs'
      - '.github/workflows/discover-search-reset-assurance.yml'
  push:
    branches:
      - main
    paths:
      - 'saas-prototype/customer-discovery.js'
      - 'scripts/validate-discover-search-reset.mjs'
      - '.github/workflows/discover-search-reset-assurance.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Validate Discover search reset behavior
        run: node scripts/validate-discover-search-reset.mjs
