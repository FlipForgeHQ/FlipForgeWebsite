name: Pre-Beta Saved-Decision Lifecycle Audit

on:
  pull_request:
    paths:
      - "saas-prototype/**"
      - "scripts/audit-prebeta-saved-decision-lifecycle-ci.mjs"
      - "scripts/diagnose-saved-decision-tracking-route-ci.mjs"
      - "scripts/validate-prebeta-saved-decision-lifecycle-audit.mjs"
      - "scripts/validate-saas-customer-lifecycle.mjs"
      - "scripts/validate-saas-customer-export.mjs"
      - "scripts/validate-saas-customer-intelligence-loop.mjs"
      - "scripts/build-identity-client.mjs"
      - "package.json"
      - "docs/PREBETA_SAVED_DECISION_LIFECYCLE_AUDIT.md"
      - ".github/workflows/prebeta-saved-decision-lifecycle-audit.yml"
  push:
    branches:
      - main
    paths:
      - "saas-prototype/**"
      - "scripts/audit-prebeta-saved-decision-lifecycle-ci.mjs"
      - "scripts/diagnose-saved-decision-tracking-route-ci.mjs"
      - "scripts/validate-prebeta-saved-decision-lifecycle-audit.mjs"
      - "scripts/validate-saas-customer-lifecycle.mjs"
      - "scripts/validate-saas-customer-export.mjs"
      - "scripts/validate-saas-customer-intelligence-loop.mjs"
      - "scripts/build-identity-client.mjs"
      - "package.json"
      - "docs/PREBETA_SAVED_DECISION_LIFECYCLE_AUDIT.md"
      - ".github/workflows/prebeta-saved-decision-lifecycle-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destructive-saved-decision-lifecycle-audit:
    name: Attack saved-decision lifecycle transitions before beta
    runs-on: ubuntu-24.04
    timeout-minutes: 14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install website dependencies
        run: npm install --no-audit --no-fund

      - name: Build production app assets
        run: npm run build:identity

      - name: Validate governed saved-decision contracts
        run: |
          npm run validate:customer-intelligence
          npm run validate:customer-lifecycle
          npm run validate:customer-export
          node scripts/validate-prebeta-saved-decision-lifecycle-audit.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local SaaS preview at production app path
        run: |
          node saas-prototype/serve.mjs > /tmp/flipforge-prebeta-lifecycle-audit-server.log 2>&1 &
          echo $! > /tmp/flipforge-prebeta-lifecycle-audit-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/app/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/flipforge-prebeta-lifecycle-audit-server.log
          exit 1

      - name: Diagnose Saved Decision to Tracking route ownership
        run: node scripts/diagnose-saved-decision-tracking-route-ci.mjs

      - name: Run destructive saved-decision lifecycle browser matrix
        run: npm run audit:prebeta-saved-decision-lifecycle

      - name: Upload saved-decision lifecycle audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flipforge-prebeta-saved-decision-lifecycle-audit
          path: qa-artifacts/prebeta-saved-decision-lifecycle
          if-no-files-found: warn
          retention-days: 30

      - name: Show preview-server log on failure
        if: failure()
        run: cat /tmp/flipforge-prebeta-lifecycle-audit-server.log || true
