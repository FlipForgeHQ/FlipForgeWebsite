name: Phase 7 Proof Routing

on:
  pull_request:
    paths:
      - "saas-prototype/bulk-evaluation.js"
      - "scripts/validate-phase7-proof-routing.mjs"
      - ".github/workflows/phase7-proof-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Syntax check normal Bulk Evaluate
        run: node --check saas-prototype/bulk-evaluation.js
      - name: Validate proof routing boundary
        run: node scripts/validate-phase7-proof-routing.mjs
