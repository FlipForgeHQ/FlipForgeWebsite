name: Mobile Navigation Assurance

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'assets/js/site.js'
      - 'assets/js/homepage-v1.js'
      - 'assets/css/site.css'
      - '.github/workflows/mobile-navigation-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate responsive mobile navigation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse navigation JavaScript
        run: |
          node --check assets/js/site.js
          node --check assets/js/homepage-v1.js
      - name: Validate mobile navigation contract
        shell: bash
        run: |
          set -euo pipefail
          NAV_JS='assets/js/homepage-v1.js'

          grep -q 'class="menu-toggle"' index.html
          grep -q 'aria-expanded="false"' index.html
          grep -q 'aria-controls="mobile-navigation"' index.html
          grep -q 'class="mobile-nav" id="mobile-navigation"' index.html
          grep -q 'class="backdrop" aria-hidden="true"' index.html
          grep -q '<script src="assets/js/homepage-v1.js" defer></script>' index.html

          grep -q "document.querySelector('.menu-toggle')" "$NAV_JS"
          grep -q "document.querySelector('.mobile-nav')" "$NAV_JS"
          grep -q "document.querySelector('.backdrop')" "$NAV_JS"
          grep -q "toggle.setAttribute('aria-expanded','true')" "$NAV_JS"
          grep -q "toggle.setAttribute('aria-expanded','false')" "$NAV_JS"
          grep -q "event.key==='Escape'" "$NAV_JS"
          grep -q "event.key!=='Tab'" "$NAV_JS"
          grep -q "document.body.classList.add('menu-open')" "$NAV_JS"
          grep -q "document.body.classList.remove('menu-open')" "$NAV_JS"
          grep -q "window.addEventListener('resize'" "$NAV_JS"

          grep -Fq '.menu-toggle{display:none' assets/css/site.css
          grep -Fq '.mobile-nav{position:fixed' assets/css/site.css
          grep -Fq '.mobile-nav.open{' assets/css/site.css
          grep -Fq '.backdrop.open{' assets/css/site.css
          grep -Fq '@media(max-width:1000px)' assets/css/site.css
          grep -Fq '.menu-toggle{display:block}' assets/css/site.css

          echo 'PASS: Mobile navigation is implemented directly in the lightweight homepage bundle and remains keyboard/accessibility aware.'
