name: Site Menu Assurance

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'assets/js/site.js'
      - 'assets/js/homepage-v1.js'
      - 'assets/css/site.css'
      - 'assets/css/public-shell-contract-v1.css'
      - 'scripts/site-header.mjs'
      - '.github/workflows/mobile-navigation-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate the site menu (all widths)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse navigation JavaScript
        run: |
          node --check assets/js/site.js
          node --check assets/js/homepage-v5.js
      - name: Validate the site menu contract
        shell: bash
        run: |
          set -euo pipefail
          NAV_JS='assets/js/site.js'
          SHELL_CSS='assets/css/public-shell-contract-v1.css'

          # One header source on every public page; nothing else builds or rewrites it.
          node scripts/site-header.mjs

          grep -q 'class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu"' index.html
          grep -q '<span class="menu-toggle-label">Menu</span>' index.html
          grep -q 'class="site-menu" id="site-menu"' index.html
          grep -q 'class="backdrop" aria-hidden="true"' index.html
          grep -q '<script src="assets/js/site.js" defer></script>' index.html

          grep -q "document.querySelector('.menu-toggle')" "$NAV_JS"
          grep -q "document.querySelector('.site-menu')" "$NAV_JS"
          grep -q "document.querySelector('.backdrop')" "$NAV_JS"
          grep -q "toggle.setAttribute('aria-expanded','true')" "$NAV_JS"
          grep -q "toggle.setAttribute('aria-expanded','false')" "$NAV_JS"
          grep -q "e.key==='Escape'" "$NAV_JS"
          grep -q "e.key==='Tab'&&menu.classList.contains('open')" "$NAV_JS"
          grep -q "document.body.classList.add('menu-open')" "$NAV_JS"
          grep -q "document.body.classList.remove('menu-open')" "$NAV_JS"

          grep -Fq 'html body .site-header .menu-toggle{' "$SHELL_CSS"
          grep -Fq 'html body .site-menu{' "$SHELL_CSS"
          grep -Fq 'html body .site-menu.open{' "$SHELL_CSS"
          grep -Fq 'html body .backdrop.open{' "$SHELL_CSS"
          if grep -Eq 'desktop-nav|mobile-nav|menu-toggle' assets/css/site.css; then echo 'site.css must not style the header menu'; exit 1; fi

          echo 'PASS: One labeled Menu at every width, written by scripts/site-header.mjs, opened by site.js and styled by the shell contract.'
