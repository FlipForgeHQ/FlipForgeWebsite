name: Apply Forge Heat Base Router Patch

on:
  push:
    branches:
      - agent/forge-heat-pro-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/forge-heat-pro-ui
          fetch-depth: 0
      - name: Add neutral Forge Heat loading route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('saas-prototype/app.js')
          text = app.read_text()
          old = '      case "opportunities": id ? renderOpportunityDetail(id) : renderOpportunities(); break;\n      case "compare": renderCompare(); break;\n'
          new = '''      case "opportunities": id ? renderOpportunityDetail(id) : renderOpportunities(); break;
      case "forge-heat":
        main.innerHTML = `<div class="forge-heat-shell"><header class="forge-heat-hero"><div><span class="eyebrow">PRO INTELLIGENCE</span><h1>Forge Heat™</h1><p class="forge-heat-lead">Loading server-owned opportunity intelligence…</p></div></header><div class="staging-loading" role="status">Loading Forge Heat…</div></div>`;
        break;
      case "compare": renderCompare(); break;
'''
          if text.count(old) != 1:
              raise SystemExit(f'base router anchor expected once, found {text.count(old)}')
          app.write_text(text.replace(old, new, 1))

          validator = Path('scripts/validate-forge-heat-pro-ui.mjs')
          text = validator.read_text()
          old = 'const css = read("saas-prototype/customer-forge-heat.css");\n'
          new = 'const css = read("saas-prototype/customer-forge-heat.css");\nconst app = read("saas-prototype/app.js");\n'
          if text.count(old) != 1:
              raise SystemExit('validator read anchor missing')
          text = text.replace(old, new, 1)
          old = 'check("Forge Heat navigation is marked Pro", html.includes("forge-nav-pro"));\n'
          new = 'check("Forge Heat navigation is marked Pro", html.includes("forge-nav-pro"));\ncheck("Base router does not fall back to mock dashboard for Forge Heat", app.includes(\'case "forge-heat"\') && app.includes("Loading server-owned opportunity intelligence"));\n'
          if text.count(old) != 1:
              raise SystemExit('validator check anchor missing')
          validator.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-forge-heat-base-router-patch.yml
      - name: Commit base-router integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saas-prototype/app.js scripts/validate-forge-heat-pro-ui.mjs
          git commit -m "Keep Forge Heat out of prototype fallback"
          git push origin HEAD:agent/forge-heat-pro-ui
