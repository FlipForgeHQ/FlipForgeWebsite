version: 2

# Version updates are kept deliberately small: every Dependabot PR runs the
# full CI suite, so updates are grouped into at most one PR per ecosystem per
# week. Security updates (turned on in Settings -> Advanced Security) are raised
# separately as soon as an advisory is published and are not delayed by the
# schedule or cooldown below.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    # Do not propose a release until it has been public for a week; this
    # skips most malicious or broken releases that get pulled quickly.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
